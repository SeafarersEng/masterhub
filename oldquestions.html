{batch:'9m_exam1',category:'speaking',type:'Speaking (Picture Description)',en:'Bus Stop Scene',my:'ဘတ်စ်ကားမှတ်တိုင် မြင်ကွင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What are the people doing at the bus stop? / လူတွေ ဘာလုပ်နေလဲ?','How does public transportation help people in daily life? / ဘယ်လိုအကူအညီပေးသလဲ?'],
answer:{en:'In the picture, I can see a bus stop with several people waiting. Some people are standing while others are sitting on the bench. They are looking towards the road, waiting for the bus to arrive. Public transportation like buses is very helpful in daily life because it provides an affordable and convenient way to travel to work, school, and other places. It also helps reduce traffic congestion and pollution in cities.',my:'ပုံထဲမှာ လူအများအပြား စောင့်ဆိုင်းနေတဲ့ ဘတ်စ်ကားမှတ်တိုင်တစ်ခုကို မြင်ရတယ်။ တချို့လူတွေ ရပ်နေပြီး တချို့က ခုံတန်းပေါ်မှာ ထိုင်နေကြတယ်။ သူတို့က ဘတ်စ်ကားလာဖို့ လမ်းဘက်ကို ကြည့်နေကြတယ်။ ဘတ်စ်ကားလိုမျိုး အများပြည်သူသုံးယာဉ်တွေက နေ့စဉ်ဘဝမှာ အလွန်အကူအညီဖြစ်တယ်။ ဘာဖြစ်လို့လဲဆိုတော့ အလုပ်၊ ကျောင်းနဲ့ အခြားနေရာတွေကို သွားဖို့ တတ်နိုင်တဲ့နဲ့ အဆင်ပြေတဲ့ နည်းလမ်းကို ပေးတယ်။ မြို့တွေမှာ ယာဉ်ကြောပိတ်ဆို့မှုနဲ့ လေထုညစ်ညမ်းမှုကိုလည်း လျှော့ချပေးတယ်။'}},

{batch:'9m_exam1',category:'speaking',type:'Speaking (Picture Description)',en:'Healthy Food and Exercise',my:'ကျန်းမာရေးနှင့်ညီညွတ်သော အစားအစာနှင့် လေ့ကျင့်ခန်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What kind of healthy food do you eat? / ဘယ်လိုကျန်းမာရေးနဲ့ညီညွတ်တဲ့ အစားအစာတွေ စားလဲ?','Why is exercise important for health? / လေ့ကျင့်ခန်းက ဘာကြောင့် အရေးကြီးသလဲ?'],
answer:{en:'In the picture, I can see a person exercising and eating healthy food like fruits, vegetables, and salad. Healthy food gives us energy and nutrients to stay strong and active. I eat fruits like apples and bananas, and vegetables like broccoli and spinach. Exercise is important because it keeps our body fit, reduces stress, and prevents diseases like diabetes and heart problems. Regular exercise and healthy eating together create a strong and healthy body.',my:'ပုံထဲမှာ လူတစ်ယောက် လေ့ကျင့်ခန်းလုပ်နေပြီး သစ်သီး၊ ဟင်းသီးဟင်းရွက်နဲ့ သုပ်လိုမျိုး ကျန်းမာရေးနဲ့ညီညွတ်တဲ့ အစားအစာတွေ စားနေတာကို မြင်ရတယ်။ ကျန်းမာရေးနဲ့ညီညွတ်တဲ့ အစားအစာက ကျွန်တော်တို့ကို သန်စွမ်းပြီး တက်ကြွနေဖို့ စွမ်းအင်နဲ့ အာဟာရဓာတ်တွေ ပေးတယ်။ ကျွန်တော် ပန်းသီးနဲ့ ငှက်ပျောသီးလိုမျိုး သစ်သီးတွေနဲ့ ဘရိုကိုလီနဲ့ ဟင်းနုနွယ်ရွက်လိုမျိုး ဟင်းသီးဟင်းရွက်တွေ စားတယ်။ လေ့ကျင့်ခန်းက အရေးကြီးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ ကိုယ်ခန္ဓာကို ကြံ့ခိုင်စေတယ်၊ စိတ်ဖိစီးမှုကို လျှော့ချပေးတယ်၊ ဆီးချိုနဲ့ နှလုံးရောဂါလိုမျိုး ရောဂါတွေကို ကာကွယ်ပေးတယ်။ ပုံမှန်လေ့ကျင့်ခန်းနဲ့ ကျန်းမာရေးနဲ့ညီညွတ်တဲ့ အစားအစာက သန်စွမ်းကျန်းမာတဲ့ ခန္ဓာကိုယ်ကို ဖန်တီးပေးတယ်။'}},

{batch:'9m_exam1',category:'speaking',type:'Speaking (Picture Description)',en:'Firefighting Scene',my:'မီးငြှိမ်းသတ်ခြင်း မြင်ကွင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What is the firefighter doing? / မီးသတ်သမား ဘာလုပ်နေလဲ?','Why is fire safety training important? / ဘာကြောင့် အရေးကြီးသလဲ?'],
answer:{en:'In the picture, I can see a firefighter using a fire extinguisher and a fire hose to put out a fire. The firefighter is wearing protective clothing, a helmet, and safety boots. Fire safety training is very important because it teaches people how to prevent fires, how to use fire extinguishers correctly, and how to evacuate safely during an emergency. Without proper training, people may panic and make dangerous mistakes. Regular fire drills help everyone stay prepared and protect lives.',my:'ပုံထဲမှာ မီးသတ်သမားတစ်ယောက် မီးသတ်ဆေးဘူးနဲ့ မီးသတ်ပိုက်ကို သုံးပြီး မီးငြှိမ်းသတ်နေတာကို မြင်ရတယ်။ မီးသတ်သမားက အကာအကွယ်အဝတ်အစား၊ ဦးထုပ်နဲ့ ဘေးကင်းရေးဖိနပ်တွေ ဝတ်ထားတယ်။ မီးဘေးလုံခြုံရေးသင်တန်းက အရမ်းအရေးကြီးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ လူတွေကို မီးဘယ်လိုကာကွယ်ရမယ်၊ မီးသတ်ဆေးဘူးကို ဘယ်လိုမှန်ကန်စွာသုံးရမယ်၊ အရေးပေါ်အခြေအနေမှာ ဘယ်လိုဘေးကင်းစွာ ကယ်ထွက်ရမယ်ဆိုတာ သင်ပေးလို့ပါ။ သင့်လျော်တဲ့ သင်တန်းမရှိရင် လူတွေက ထိတ်လန့်ပြီး အန္တရာယ်ရှိတဲ့ အမှားတွေ လုပ်မိနိုင်တယ်။ ပုံမှန်မီးဘေးလေ့ကျင့်ခန်းတွေက လူတိုင်းကို အသင့်ပြင်ဆင်ထားဖို့နဲ့ အသက်တွေကို ကာကွယ်ဖို့ ကူညီပေးတယ်။'}},

{batch:'9m_exam1',category:'speaking',type:'Speaking (Picture Description)',en:'Family Having a Meal Together',my:'မိသားစု အတူတကွ စားသောက်နေခြင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','Who are the people in the picture? / ဘယ်သူတွေရှိလဲ?','Why is eating together as a family important? / ဘာကြောင့် အရေးကြီးသလဲ?'],
answer:{en:'In the picture, I can see a happy family sitting around a dining table sharing a meal together. There are parents and children enjoying food and talking with each other. Eating together as a family is very important because it strengthens family bonds and creates opportunities for communication. It also helps children learn good eating habits and table manners. In our busy modern lives, family meal time provides a moment to connect, share stories, and enjoy quality time together.',my:'ပုံထဲမှာ ပျော်ရွှင်တဲ့ မိသားစုတစ်စု ထမင်းစားပွဲတစ်ဝိုက်မှာ အတူတကွ ထိုင်စားနေတာကို မြင်ရတယ်။ မိဘတွေနဲ့ ကလေးတွေ အစားအစာတွေ စားသုံးပြီး အချင်းချင်း စကားပြောနေကြတယ်။ မိသားစုနဲ့အတူ အတူတကွ စားသောက်ခြင်းက အရမ်းအရေးကြီးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ မိသားစုဆက်ဆံရေးကို ခိုင်မာစေပြီး ဆက်သွယ်ပြောဆိုရန် အခွင့်အလမ်းတွေ ဖန်တီးပေးလို့ပါ။ ကလေးတွေကို စားသောက်မှုအလေ့အထကောင်းတွေနဲ့ စားပွဲအမူအကျင့်တွေ သင်ယူရာလည်း အထောက်အကူပြုတယ်။ ခေတ်သစ်အလုပ်ရှုပ်တဲ့ဘဝမှာ မိသားစုအတူစားချိန်က ဆက်သွယ်ဖို့၊ အတွေ့အကြုံတွေမျှဝေဖို့နဲ့ အတူတကွ အရည်အသွေးရှိတဲ့ အချိန်တွေကို ခံစားဖို့ အခွင့်အရေးပေးတယ်။'}},

{batch:'9m_exam1',category:'debate',type:'Speaking (Debate / Discussion)',en:'Getting Enough Sleep',my:'လုံလောက်စွာ အိပ်စက်ခြင်း',
sub:['Do you agree that getting enough sleep is important for health? / လုံလောက်စွာ အိပ်စက်ခြင်းက ကျန်းမာရေးအတွက် အရေးကြီးတယ်ဆိုတာ သဘောတူလား?','How many hours of sleep do you usually get? / ပုံမှန် အိပ်ချိန် ဘယ်နှစ်နာရီရလဲ?','What are the effects of not getting enough sleep? / ဆိုးကျိုးတွေက ဘာတွေလဲ?'],
answer:{en:'Yes, I strongly agree that getting enough sleep is very important for health. Sleep is essential for physical and mental recovery. I usually get about 7 to 8 hours of sleep each night. Not getting enough sleep can cause many problems like difficulty concentrating, weak immune system, mood swings, and increased risk of serious health issues like heart disease and diabetes. Good sleep habits help us stay alert, energetic, and productive throughout the day.',my:'ဟုတ်ကဲ့၊ လုံလောက်စွာ အိပ်စက်ခြင်းက ကျန်းမာရေးအတွက် အရမ်းအရေးကြီးတယ်ဆိုတာကို ကျွန်တော် အပြင်းအထန် သဘောတူတယ်။ အိပ်စက်ခြင်းက ရုပ်ပိုင်းဆိုင်ရာနဲ့ စိတ်ပိုင်းဆိုင်ရာ ပြန်လည်ကောင်းမွန်ဖို့ မရှိမဖြစ်လိုအပ်တယ်။ ကျွန်တော် ညတိုင်း ၇ နာရီကနေ ၈ နာရီလောက် အိပ်တယ်။ အိပ်ရေးမဝခြင်းက အာရုံစူးစိုက်ရခက်ခြင်း၊ ကိုယ်ခံအားစနစ်အားနည်းခြင်း၊ စိတ်အပြောင်းအလဲမြန်ခြင်းနဲ့ နှလုံးရောဂါနဲ့ ဆီးချိုလိုမျိုး ပြင်းထန်တဲ့ ကျန်းမာရေးပြဿနာတွေ ဖြစ်နိုင်ခြေ များလာခြင်းတွေ ဖြစ်စေနိုင်တယ်။ အိပ်စက်ခြင်းအလေ့အထကောင်းတွေက ကျွန်တော်တို့ကို နိုးကြားပြီး စွမ်းအင်ပြည့်ဝကာ တစ်နေ့တာလုံး ထိရောက်မှုရှိစေတယ်။'}},

{batch:'9m_exam1',category:'debate',type:'Speaking (Debate / Discussion)',en:'Drinking Enough Water',my:'ရေဓာတ်လုံလောက်စွာ သောက်သုံးခြင်း',
sub:['Do you agree that drinking enough water is essential for health? / ရေဓာတ်လုံလောက်စွာ သောက်သုံးခြင်းက ကျန်းမာရေးအတွက် မရှိမဖြစ်လိုအပ်တယ်ဆိုတာ သဘောတူလား?','How much water do you drink every day? / တစ်နေ့ ရေဘယ်လောက်သောက်လဲ?','What happens if we don\'t drink enough water? / ရေဓာတ်မလုံလောက်ရင် ဘာဖြစ်မလဲ?'],
answer:{en:'Yes, I completely agree that drinking enough water is essential for health. Water is vital for our body to function properly. I drink about 2 to 3 liters of water every day. If we don\'t drink enough water, we can become dehydrated, which can cause fatigue, dizziness, headaches, and digestive problems. In severe cases, dehydration can harm our kidneys and other organs. Staying hydrated helps our skin stay healthy, improves our concentration, and supports overall well-being.',my:'ဟုတ်ကဲ့၊ ရေဓာတ်လုံလောက်စွာ သောက်သုံးခြင်းက ကျန်းမာရေးအတွက် မရှိမဖြစ်လိုအပ်တယ်ဆိုတာကို ကျွန်တော် အပြည့်အဝ သဘောတူတယ်။ ရေဟာ ကိုယ်ခန္ဓာက မှန်ကန်စွာ လည်ပတ်ဖို့ အသက်သွေးကြောဖြစ်တယ်။ ကျွန်တော် တစ်နေ့ ရေ ၂ လီတာကနေ ၃ လီတာလောက် သောက်တယ်။ ရေဓာတ်မလုံလောက်ရင် ရေဓာတ်ခန်းခြောက်မှု ဖြစ်နိုင်ပြီး ပင်ပန်းနွမ်းနယ်ခြင်း၊ မူးဝေခြင်း၊ ခေါင်းကိုက်ခြင်းနဲ့ အစာခြေစနစ်ပြဿနာတွေ ဖြစ်စေနိုင်တယ်။ ပြင်းထန်တဲ့အခြေအနေမှာ ရေဓာတ်ခန်းခြောက်ခြင်းက ကျောက်ကပ်နဲ့ အခြားအင်္ဂါအစိတ်အပိုင်းတွေကို ထိခိုက်စေနိုင်တယ်။ ရေဓာတ်ပြည့်ဝနေခြင်းက အရေပြားကို ကျန်းမာစေတယ်၊ အာရုံစူးစိုက်နိုင်စွမ်းကို ကောင်းမွန်စေတယ်၊ ခြုံငုံကျန်းမာရေးကို အထောက်အကူပြုတယ်။'}},

{batch:'9m_exam1',category:'debate',type:'Speaking (Debate / Discussion)',en:'Importance of English',my:'အင်္ဂလိပ်စာ၏ အရေးပါမှု',
sub:['Do you agree that English is important for everyone? / အင်္ဂလိပ်စာက လူတိုင်းအတွက် အရေးကြီးတယ်ဆိုတာ သဘောတူလား?','Why is English important for seafarers? / ရေကြောင်းသားတွေအတွက် ဘာကြောင့် အရေးကြီးသလဲ?','How can we improve our English skills? / ဘယ်လိုမြှင့်တင်နိုင်မလဲ?'],
answer:{en:'Yes, I strongly agree that English is very important for everyone in today\'s globalized world. English is the most widely spoken language for international communication. For seafarers, English is even more crucial because it is the official language of the sea. Crew members on ships come from different countries, and they use English to communicate safety instructions, navigation commands, and emergency procedures. To improve English skills, we can read books, watch movies, practice speaking with others, and take courses. Consistent practice and exposure to the language are the best ways to improve.',my:'ဟုတ်ကဲ့၊ ယနေ့ခေတ် ကမ္ဘာ့ဖလားပြင်ဖြစ်နေတဲ့ ကမ္ဘာမှာ အင်္ဂလိပ်စာက လူတိုင်းအတွက် အရမ်းအရေးကြီးတယ်ဆိုတာကို ကျွန်တော် အပြင်းအထန် သဘောတူတယ်။ အင်္ဂလိပ်စာဟာ နိုင်ငံတကာဆက်သွယ်ရေးအတွက် အကျယ်ပြန့်ဆုံး ပြောဆိုသုံးစွဲတဲ့ ဘာသာစကားဖြစ်တယ်။ ရေကြောင်းသားတွေအတွက် အင်္ဂလိပ်စာက ပိုပြီးအရေးကြီးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ ဒါက ပင်လယ်ပြင်ရဲ့ တရားဝင်ဘာသာစကားဖြစ်လို့ပါ။ သင်္ဘောပေါ်က အမှုထမ်းတွေက နိုင်ငံအမျိုးမျိုးကလာကြပြီး ဘေးကင်းရေးညွှန်ကြားချက်တွေ၊ သွားလာရေးအမိန့်တွေနဲ့ အရေးပေါ်လုပ်ထုံးလုပ်နည်းတွေကို ဆက်သွယ်ဖို့ အင်္ဂလိပ်စာကို သုံးကြတယ်။ အင်္ဂလိပ်စာစွမ်းရည်ကို မြှင့်တင်ဖို့ စာအုပ်တွေဖတ်နိုင်တယ်၊ ရုပ်ရှင်တွေကြည့်နိုင်တယ်၊ တစ်ယောက်နဲ့တစ်ယောက် စကားပြောလေ့ကျင့်နိုင်တယ်၊ သင်တန်းတွေတက်နိုင်တယ်။ စဉ်ဆက်မပြတ် လေ့ကျင့်ခြင်းနဲ့ ဘာသာစကားနဲ့ ထိတွေ့ခြင်းက တိုးတက်ဖို့ အကောင်းဆုံးနည်းလမ်းတွေပါ။'}},

/* ===== 9M EXAM 4 ===== */
{batch:'9m_exam4',category:'personal',type:'Speaking (General Questions)',en:'Personal Information & Daily Life',my:'ကိုယ်ရေးကိုယ်တာ အချက်အလက်နှင့် နေ့စဉ်ဘဝ',
sub:['What is your name? / နာမည် ဘယ်လိုခေါ်လဲ?','How old are you? / အသက် ဘယ်လောက်လဲ?','Where are you from? / ဘယ်ကလာလဲ?','What are the popular places in your hometown? / ဇာတိမြို့မှာ ဘယ်နေရာတွေ ကျော်ကြားလဲ?','What do you usually do on your phone? / ဖုန်းပေါ်မှာ များသောအားဖြင့် ဘာလုပ်လဲ?','Who motivates you? / မင်းကို ဘယ်သူ လှုံ့ဆော်ပေးလဲ?'],
answer:{en:'My name is Aung Myo. I am 24 years old. I am from Yangon, Myanmar. The popular places in my hometown are Shwedagon Pagoda, Sule Pagoda, and Bogyoke Market. On my phone, I usually check messages, watch educational videos, and read news. My mother motivates me the most because she always encourages me to work hard and never give up.',my:'ကျွန်တော့်နာမည်က အောင်မျိုးပါ။ အသက် ၂၄ နှစ်ပါ။ မြန်မာနိုင်ငံ၊ ရန်ကုန်ကလာတာပါ။ ကျွန်တော့်ဇာတိမြို့မှာ ကျော်ကြားတဲ့နေရာတွေက ရွှေတိဂုံစေတီတော်၊ ဆူးလေစေတီတော်နဲ့ ဗိုလ်ချုပ်ဈေးပါ။ ဖုန်းပေါ်မှာ များသောအားဖြင့် စာတွေစစ်တယ်၊ ပညာရေးဗီဒီယိုတွေကြည့်တယ်၊ သတင်းတွေဖတ်တယ်။ ကျွန်တော့်ကို အမေက အများဆုံး လှုံ့ဆော်ပေးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ သူက ကျွန်တော့်ကို အမြဲကြိုးစားပြီး လက်မလျှော့ဖို့ အားပေးလို့ပါ။'}},

{batch:'9m_exam4',category:'personal',type:'Speaking (Experience)',en:'Most Excited Experience - Graduation Day',my:'အစိတ်လှုပ်ရှားဆုံး အတွေ့အကြုံ - ဘွဲ့ယူခဲ့တဲ့အချိန်',
sub:['What is the most exciting experience in your life? / ဘဝမှာ အစိတ်လှုပ်ရှားဆုံး အတွေ့အကြုံက ဘာလဲ?','What degree did you get? / ဘာဘွဲ့ ရခဲ့လဲ?','Which school did you graduate from? / ဘယ်ကျောင်းကနေ ဘွဲ့ရခဲ့တာလဲ?','What projects or activities did you do at school? / ဘယ် project/activity တွေ လုပ်ခဲ့လဲ?'],
answer:{en:'The most exciting experience in my life was my graduation day. I received a Bachelor of Arts degree in English. I graduated from Yangon University of Distance Education. During my school years, I participated in many activities such as English speaking clubs, volunteer programs, and group projects. I also helped organize a charity event for children. These experiences helped me build confidence, teamwork, and leadership skills.',my:'ကျွန်တော့်ဘဝမှာ အစိတ်လှုပ်ရှားဆုံး အတွေ့အကြုံက ကျွန်တော့်ဘွဲ့ယူခဲ့တဲ့နေ့ပါ။ ကျွန်တော် အင်္ဂလိပ်စာဖြင့် ဝိဇ္ဇာဘွဲ့ ရရှိခဲ့တယ်။ ရန်ကုန်အဝေးသင်တက္ကသိုလ်ကနေ ဘွဲ့ရခဲ့တာပါ။ ကျောင်းနေစဉ်အတွင်း အင်္ဂလိပ်စကားပြောကလပ်၊ စေတနာ့ဝန်ထမ်းအစီအစဉ်တွေနဲ့ အုပ်စုလိုက်လုပ်ငန်းတွေလိုမျိုး လှုပ်ရှားမှုတွေ အများကြီး ပါဝင်ခဲ့တယ်။ ကလေးတွေအတွက် ပရဟိတပွဲတစ်ခုကို စီစဉ်ရာမှာလည်း ကူညီခဲ့တယ်။ ဒီအတွေ့အကြုံတွေက ကျွန်တော့်ကို ယုံကြည်မှု၊ အသင်းလိုက်လုပ်ဆောင်မှုနဲ့ ခေါင်းဆောင်မှုစွမ်းရည်တွေ တည်ဆောက်ပေးခဲ့တယ်။'}},

{batch:'9m_exam4',category:'speaking',type:'Speaking (Picture Description)',en:'Picture: Travel Items (Luggage, Bag, Notebook)',my:'ဓါတ်ပုံ: ခရီးသွားပစ္စည်းများ',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','Where would you like to travel? / ဘယ်နေရာကို သွားရောက်လည်ပတ်ချင်လဲ?','What do you always take on vacation? / အားလပ်ရပ်မှာ အမြဲ ဘာတွေယူသွားလဲ?','What will you do next weekend? / နောက်တစ်ပတ် weekends ကျရင် ဘာလုပ်မလဲ?','Where will you go shopping? / ဘယ်ကို shopping ထွက်မှာလဲ?','Where is the shopping place located? / shopping ထွက်မယ့်နေရာက ဘယ်နားမှာရှိလဲ?'],
answer:{en:'In the picture, I can see travel items like luggage, a handbag, and a notebook. These are things people pack when going on a trip. I would like to travel to Japan because I want to see its beautiful temples and modern cities. On vacation, I always take my passport, phone charger, clothes, and a small notebook for writing. Next weekend, I will go shopping with my family. We will go to a shopping mall near the bus stop in my township. It is located about 10 minutes from my house by car.',my:'ပုံထဲမှာ ခရီးသွားပစ္စည်းတွေဖြစ်တဲ့ အိတ်၊ လက်ဆွဲအိတ်နဲ့ မှတ်စုစာအုပ်တွေကို မြင်ရတယ်။ ဒါတွေက ခရီးသွားတဲ့အခါ လူတွေ ထည့်သွင်းတဲ့ ပစ္စည်းတွေပါ။ ကျွန်တော် ဂျပန်ကို သွားရောက်လည်ပတ်ချင်တယ်။ ဘာဖြစ်လို့လဲဆိုတော့ လှပတဲ့ဘုရားကျောင်းတွေနဲ့ ခေတ်မီမြို့တွေကို မြင်ချင်လို့ပါ။ အားလပ်ရပ်မှာ နိုင်ငံကူးလက်မှတ်၊ ဖုန်းအားသွင်းကြိုး၊ အဝတ်အစားတွေနဲ့ စာရေးဖို့ မှတ်စုစာအုပ်လေးတစ်အုပ် အမြဲယူသွားတယ်။ နောက်တစ်ပတ် weekends မှာ မိသားစုနဲ့ shopping ထွက်မယ်။ ကျွန်တော်တို့ မြို့နယ်ထဲက ဘတ်စ်ကားမှတ်တိုင်အနီးမှာရှိတဲ့ shopping mall ကို သွားမယ်။ အိမ်ကနေ ကားနဲ့ ၁၀ မိနစ်လောက် ဝေးတယ်။'}},

{batch:'9m_exam4',category:'speaking',type:'Speaking (Picture Description)',en:'Picture: Firefighting - Fire Extinguisher Usage',my:'ဓါတ်ပုံ: မီးသတ်ခြင်း - မီးသတ်ဆေးဘူး အသုံးပြုပုံ',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','Do you know how to use a fire extinguisher? / မီးသတ်ဆေးဘူး သုံးတတ်လား?','What are the steps to use a fire extinguisher? / မီးသတ်ဆေးဘူး အသုံးပြုပုံ အဆင့်ဆင့်က ဘာတွေလဲ?','Why is fire safety important? / မီးဘေးလုံခြုံရေးက ဘာကြောင့် အရေးကြီးသလဲ?'],
answer:{en:'In the picture, I can see a firefighter using a fire extinguisher to put out a fire. Yes, I know how to use a fire extinguisher. The steps are: First, pull the pin. Second, aim the nozzle at the base of the fire. Third, squeeze the handle. Fourth, sweep the nozzle side to side. Remember the word "PASS" - Pull, Aim, Squeeze, Sweep. Fire safety is important because fires can spread quickly and cause serious damage to property and lives. Knowing how to use a fire extinguisher can save lives.',my:'ပုံထဲမှာ မီးသတ်သမားတစ်ယောက် မီးသတ်ဆေးဘူးကိုသုံးပြီး မီးငြှိမ်းသတ်နေတာကို မြင်ရတယ်။ ဟုတ်ကဲ့၊ ကျွန်တော် မီးသတ်ဆေးဘူး သုံးတတ်ပါတယ်။ အဆင့်တွေက ပထမ၊ ဇာပင် (pin) ကို ဆွဲထုတ်ပါ။ ဒုတိယ၊ မီးရဲ့အောက်ခြေကို ပစ်မှတ်ထားပါ။ တတိယ၊ လက်ကိုင်ကို ဆွဲညှစ်ပါ။ စတုတ္ထ၊ နော်ဇယ်ကို ဘေးတစ်ဖက်တစ်ချက် လှုပ်ရှားပါ။ "PASS" ဆိုတဲ့ စကားလုံးကို မှတ်ထားပါ - Pull, Aim, Squeeze, Sweep။ မီးဘေးလုံခြုံရေးက အရေးကြီးတယ်။ ဘာဖြစ်လို့လဲဆိုတော့ မီးက လျင်မြန်စွာ ပျံ့နှံ့ပြီး ပစ္စည်းဥစ္စာနဲ့ အသက်တွေကို ပြင်းထန်စွာ ထိခိုက်စေနိုင်လို့ပါ။ မီးသတ်ဆေးဘူး သုံးတတ်ခြင်းက အသက်တွေကို ကယ်နိုင်တယ်။'}},

{batch:'9m_exam4',category:'debate',type:'Speaking (Debate / Discussion)',en:'Friendly Coworkers - Working Together',my:'ဖော်ရွေသော လုပ်ဖော်ကိုင်ဖက်များ - အတူတကွ အလုပ်လုပ်ခြင်း',
sub:['Do you agree that working with coworkers creates a better job? / လုပ်ဖော်ကိုင်ဖက်တွေနဲ့ အလုပ်လုပ်တာက ပိုကောင်းမွန်တဲ့ အလုပ်တစ်ခုကို ဖန်တီးနိုင်တယ်လို့ ထင်လား?','What problems can happen when coworkers do not get along? / ဘယ်လိုပြဿနာတွေ ဖြစ်နိုင်လဲ?','How can coworkers help each other at work? / ဘယ်လိုကူညီနိုင်လဲ?','Should coworkers respect each other? Why? / လေးစားသင့်လား? ဘာကြောင့်လဲ?'],
answer:{en:'Yes, I agree that working with friendly coworkers creates a better job. When coworkers get along well, they communicate openly, share ideas, and solve problems together. This creates a positive work environment. If coworkers do not get along, problems can happen such as misunderstandings, delays in work, low productivity, and high stress. Coworkers can help each other by sharing knowledge, offering support during difficult tasks, and giving constructive feedback. Yes, coworkers should always respect each other because respect builds trust and teamwork. When people feel respected, they are more motivated and work harder. A respectful workplace leads to success for everyone.',my:'ဟုတ်ကဲ့၊ ဖော်ရွေတဲ့ လုပ်ဖော်ကိုင်ဖက်တွေနဲ့ အလုပ်လုပ်တာက ပိုကောင်းမွန်တဲ့ အလုပ်တစ်ခုကို ဖန်တီးနိုင်တယ်လို့ ကျွန်တော် သဘောတူတယ်။ လုပ်ဖော်ကိုင်ဖက်တွေ အဆင်ပြေကြရင် ပွင့်လင်းစွာ ဆက်သွယ်ပြောဆိုတယ်၊ အကြံဉာဏ်တွေမျှဝေတယ်၊ ပြဿနာတွေကို အတူတကွ ဖြေရှင်းကြတယ်။ ဒါက အပြုသဘောဆောင်တဲ့ လုပ်ငန်းခွင်ကို ဖန်တီးပေးတယ်။ လုပ်ဖော်ကိုင်ဖက်တွေ အဆင်မပြေရင် နားလည်မှုလွဲမှားခြင်း၊ အလုပ်နှောင့်နှေးခြင်း၊ ကုန်ထုတ်စွမ်းအားနည်းခြင်းနဲ့ စိတ်ဖိစီးမှုမြင့်မားခြင်းလိုမျိုး ပြဿနာတွေ ဖြစ်နိုင်တယ်။ လုပ်ဖော်ကိုင်ဖက်တွေက အသိပညာမျှဝေခြင်း၊ ခက်ခဲတဲ့အလုပ်တွေမှာ ပံ့ပိုးကူညီခြင်းနဲ့ အပြုသဘောဆောင်တဲ့ တုံ့ပြန်ချက်ပေးခြင်းတို့ဖြင့် တစ်ယောက်ကိုတစ်ယောက် ကူညီနိုင်တယ်။ ဟုတ်ကဲ့၊ လုပ်ဖော်ကိုင်ဖက်တွေ အမြဲတမ်း တစ်ယောက်ကိုတစ်ယောက် လေးစားသင့်တယ်။ ဘာဖြစ်လို့လဲဆိုတော့ လေးစားမှုက ယုံကြည်မှုနဲ့ အသင်းလိုက်လုပ်ဆောင်မှုကို တည်ဆောက်ပေးလို့ပါ။ လူတွေ လေးစားခံရတယ်လို့ ခံစားရရင် ပိုပြီးစိတ်အားထက်သန်ပြီး ပိုကြိုးစားလုပ်ကိုင်ကြတယ်။ လေးစားမှုရှိတဲ့ လုပ်ငန်းခွင်က လူတိုင်းအတွက် အောင်မြင်မှုကို ဖြစ်စေတယ်။'}},

{batch:'9m_exam4',category:'debate',type:'Grammar Practice',en:'Grammar Structures (interested + in, am/is/are + Ving, has/have + V3, Remember + to)',my:'သဒ္ဒါပုံစံများ',
sub:['interested + in + Ving / Noun','am/is/are + Ving (Present Continuous)','has/have + V3 (Present Perfect)','Remember + to + V1'],
answer:{en:'Here are examples of the grammar structures: 1) Interested + in: "I am interested in learning new languages." 2) Present Continuous (am/is/are + Ving): "They are playing football in the park." 3) Present Perfect (has/have + V3): "She has visited Japan twice." 4) Remember + to + V1: "Remember to lock the door before you leave." These structures are very common in everyday English and are important for exams.',my:'သဒ္ဒါပုံစံတွေရဲ့ ဥပမာတွေက ဒီလိုပါ။ ၁) interested + in: "ကျွန်တော် ဘာသာစကားအသစ်တွေ သင်ယူရတာ စိတ်ဝင်စားတယ်။" ၂) Present Continuous: "သူတို့ ပန်းခြံထဲမှာ ဘောလုံးကစားနေကြတယ်။" ၃) Present Perfect: "သူ ဂျပန်ကို နှစ်ကြိမ် သွားရောက်ဖူးတယ်။" ၄) Remember + to + V1: "မထွက်ခင်မှာ တံခါးသော့ခတ်ဖို့ မမေ့ပါနဲ့။" ဒီပုံစံတွေက နေ့စဉ်အင်္ဂလိပ်စာမှာ အလွန်အသုံးများပြီး စာမေးပွဲတွေအတွက် အရေးကြီးပါတယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Reading Comprehension',en:'Reading: Visit to a Museum near the Port',my:'Reading: ဆိပ်ကမ်းအနီးရှိ ပြတိုက်သို့ သွားရောက်ခြင်း',
sub:['What did the writer do? / စာရေးသူ ဘာလုပ်ခဲ့လဲ?','Where is the museum located? / ပြတိုက်က ဘယ်မှာတည်ရှိလဲ?','What did the writer learn from the visit? / ဘာသင်ယူခဲ့လဲ?'],
answer:{en:'Last month, I visited a museum located near the port. The museum displays the history of maritime trade and shipping. I saw old ship models, navigation instruments, and photographs of ancient ports. The museum guide explained how ships transported goods across the oceans. I learned a lot about the maritime industry and its importance to global trade. It was an educational and memorable experience.',my:'ပြီးခဲ့တဲ့လက ကျွန်တော် ဆိပ်ကမ်းအနီးမှာရှိတဲ့ ပြတိုက်တစ်ခုကို သွားရောက်လည်ပတ်ခဲ့တယ်။ ပြတိုက်က ရေကြောင်းကုန်သွယ်မှုနဲ့ သင်္ဘောသမိုင်းကို ပြသထားတယ်။ ရှေးဟောင်းသင်္ဘောပုံစံတွေ၊ သွားလာရေးကိရိယာတွေနဲ့ ရှေးခေတ်ဆိပ်ကမ်းတွေရဲ့ ဓာတ်ပုံတွေကို မြင်ခဲ့ရတယ်။ ပြတိုက်လမ်းညွှန်က သင်္ဘောတွေ သမုဒ္ဒရာတွေကို ဖြတ်ပြီး ကုန်ပစ္စည်းတွေ ဘယ်လိုသယ်ဆောင်ခဲ့ကြသလဲဆိုတာ ရှင်းပြခဲ့တယ်။ ရေကြောင်းလုပ်ငန်းနဲ့ ကမ္ဘာ့ကုန်သွယ်ရေးအတွက် သူ့ရဲ့အရေးပါမှုအကြောင်း အများကြီး သင်ယူခဲ့ရတယ်။ ဒါက ပညာရေးဆိုင်ရာနဲ့ အမှတ်တရဖြစ်စရာ အတွေ့အကြုံတစ်ခုပါ။'}},

{batch:'9m_exam4',category:'writing',type:'Reading Comprehension',en:'Reading: Taking a Fashion Course',my:'Reading: Fashion သင်တန်းတက်ခြင်း',
sub:['What course is the writer going to take? / ဘယ်သင်တန်းတက်မလဲ?','Why does the writer want to take this course? / ဘာကြောင့် တက်ချင်တာလဲ?','What will the writer learn? / ဘာတွေသင်ယူမယ်လဲ?'],
answer:{en:'Next month, I am going to take a fashion design course at a local training center. I have always been interested in fashion and clothing design. I want to learn how to create my own clothes and maybe start a small business in the future. In this course, I will learn about fabric selection, sewing techniques, pattern making, and fashion illustration. The course lasts for three months and includes both theory and practical sessions. I am very excited about it.',my:'နောက်လမှာ ကျွန်တော် ဒေသတွင်းသင်တန်းဌာနတစ်ခုမှာ fashion design သင်တန်းတက်မယ်။ ကျွန်တော် fashion နဲ့ အဝတ်အစားဒီဇိုင်းကို အမြဲစိတ်ဝင်စားခဲ့တယ်။ ကိုယ်တိုင် အဝတ်အစားတွေ ဖန်တီးနည်းကို သင်ယူပြီး အနာဂတ်မှာ စီးပွားရေးလုပ်ငန်းလေးတစ်ခု စတင်နိုင်မယ်လို့ မျှော်လင့်တယ်။ ဒီသင်တန်းမှာ အထည်အရွေးချယ်ခြင်း၊ ချုပ်နည်းပညာတွေ၊ ပုံစံဖန်တီးခြင်းနဲ့ fashion illustration တွေအကြောင်း သင်ယူမယ်။ သင်တန်းက သုံးလကြာပြီး သီအိုရီနဲ့ လက်တွေ့သင်ခန်းစာတွေ နှစ်မျိုးလုံး ပါဝင်တယ်။ ဒါကို ကျွန်တော် အရမ်းစိတ်လှုပ်ရှားနေတယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Reading Comprehension',en:'Reading: Passport Renewal Process',my:'Reading: နိုင်ငံကူးလက်မှတ် သက်တမ်းတိုးခြင်း',
sub:['What is the writer going to do? / စာရေးသူ ဘာလုပ်မလဲ?','Why does the writer need to renew the passport? / ဘာကြောင့် သက်တမ်းတိုးဖို့လိုတာလဲ?','What documents are needed for passport renewal? / ဘယ်စာရွက်စာတမ်းတွေ လိုအပ်လဲ?'],
answer:{en:'My passport will expire in three months, so I need to renew it soon. I will go to the passport office next week to submit my application. For renewal, I need my old passport, a copy of my national ID card, two recent photos, and a completed application form. The process usually takes about two weeks. I need the new passport because I am planning to travel abroad next year. Renewing the passport on time is important to avoid any travel problems.',my:'ကျွန်တော့်နိုင်ငံကူးလက်မှတ် သုံးလအတွင်း သက်တမ်းကုန်မယ်။ ဒါကြောင့် မကြာမီ သက်တမ်းတိုးဖို့လိုတယ်။ နောက်တစ်ပတ်မှာ လျှောက်လွှာတင်ဖို့ နိုင်ငံကူးလက်မှတ်ရုံးကို သွားမယ်။ သက်တမ်းတိုးဖို့ နိုင်ငံကူးလက်မှတ်အ�ောင်း၊ မှတ်ပုံတင်ကတ်ပြားမိတ္တူ၊ မကြာသေးမီက ဓာတ်ပုံနှစ်ပုံနဲ့ ဖြည့်စွက်ပြီးသား လျှောက်လွှာတစ်ခု လိုအပ်တယ်။ လုပ်ငန်းစဉ်က နှစ်ပတ်လောက်ကြာတယ်။ နောက်နှစ်မှာ နိုင်ငံခြားသွားဖို့ စီစဉ်ထားလို့ နိုင်ငံကူးလက်မှတ်အသစ် လိုအပ်တယ်။ ခရီးသွားပြဿနာတွေ မဖြစ်ရအောင် နိုင်ငံကူးလက်မှတ်ကို အချိန်မီ သက်တမ်းတိုးဖို့ အရေးကြီးတယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Writing Task (80-100 words)',en:'An Activity I Did During the Rainy Season',my:'မိုးရာသီမှာ လုပ်ခဲ့တဲ့ activity တစ်ခုအကြောင်း',
sub:['Write about an activity you did during the rainy season. (80-100 words)'],
answer:{en:'During the rainy season last year, I joined a volunteer group to help flood victims in my township. We collected donations such as clothes, food, and medicine from local people. Then we packed them into relief bags and distributed them to families affected by the flood. It was a meaningful and emotional experience. Even though the weather was difficult, we worked together as a team. I felt happy to help others and learned the importance of community support during emergencies.',my:'ပြီးခဲ့တဲ့နှစ် မိုးရာသီမှာ ကျွန်တော် ကျွန်တော့်မြို့နယ်က ရေကြီးဒုက္ခသည်တွေကို ကူညီဖို့ စေတနာ့ဝန်ထမ်းအဖွဲ့တစ်ခုနဲ့ ပူးပေါင်းခဲ့တယ်။ အဝတ်အစား၊ အစားအစာနဲ့ ဆေးဝါးတွေလိုမျိုး လှူဒါန်းမှုတွေကို ဒေသခံတွေဆီကနေ စုဆောင်းခဲ့တယ်။ ပြီးတော့ အဲဒါတွေကို ကယ်ဆယ်ရေးအိတ်တွေထဲ ထည့်ပြီး ရေကြီးဒဏ်ခံခဲ့ရတဲ့ မိသားစုတွေဆီ ဖြန့်ဝေခဲ့တယ်။ ဒါက အဓိပ္ပာယ်ရှိပြီး စိတ်ခံစားမှုရှိတဲ့ အတွေ့အကြုံတစ်ခုပါ။ ရာသီဥတုက ခက်ခဲပေမယ့် ကျွန်တော်တို့ အဖွဲ့တစ်ဖွဲ့အနေနဲ့ အတူတကွ လုပ်ဆောင်ခဲ့ကြတယ်။ အခြားသူတွေကို ကူညီရတာ ဝမ်းသာပြီး အရေးပေါ်အခြေအနေတွေမှာ လူမှုအသိုင်းအဝိုင်း ပံ့ပိုးကူညီမှုရဲ့ အရေးပါမှုကို သင်ယူခဲ့ရတယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Writing Task (80-100 words)',en:'An AI Tool I Recently Used',my:'မကြာသေးမီက သုံးခဲ့တဲ့ AI Tool တစ်ခုအကြောင်း',
sub:['Write about an AI tool you recently used. (80-100 words)'],
answer:{en:'Recently, I used ChatGPT, an AI-powered chatbot, to help me with my English studies. I asked it to explain grammar rules, correct my writing, and give me practice questions. It provided clear explanations and helpful examples. I also used it to translate some difficult words from English to Myanmar. The tool was very fast and convenient. However, I always double-checked the information with my teacher or textbooks. Overall, AI tools like ChatGPT are useful for learning if we use them responsibly.',my:'မကြာသေးမီက ကျွန်တော် အင်္ဂလိပ်စာလေ့လာမှုအတွက် ကူညီဖို့ AI-powered chatbot ဖြစ်တဲ့ ChatGPT ကို သုံးခဲ့တယ်။ သဒ္ဒါစည်းမျဉ်းတွေ ရှင်းပြဖို့၊ ကျွန်တော့်အရေးအသားကို ပြင်ပေးဖို့နဲ့ လေ့ကျင့်ခန်းမေးခွန်းတွေ ပေးဖို့ တောင်းဆိုခဲ့တယ်။ ရှင်းလင်းတဲ့ ရှင်းပြချက်တွေနဲ့ အထောက်အကူဖြစ်တဲ့ ဥပမာတွေ ပေးခဲ့တယ်။ ခက်ခဲတဲ့ စကားလုံးတချို့ကို အင်္ဂလိပ်ကနေ မြန်မာကို ဘာသာပြန်ဖို့လည်း သုံးခဲ့တယ်။ အဲဒီ tool က အလွန်မြန်ပြီး အဆင်ပြေတယ်။ ဒါပေမယ့် အချက်အလက်တွေကို ဆရာ/ဆရာမ ဒါမှမဟုတ် ဖတ်စာအုပ်တွေနဲ့ အမြဲတမ်း ပြန်စစ်ဆေးခဲ့တယ်။ ခြုံငုံကြည့်ရင် ChatGPT လိုမျိုး AI tool တွေက တာဝန်ယူမှုရှိရှိ သုံးရင် သင်ယူဖို့ အသုံးဝင်တယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Writing Task (80-100 words)',en:'Moving to Another City for a New Job',my:'အလုပ်အသစ်တစ်ခုရလို့ တစ်ခြားမြို့ကို ပြောင်းလာခဲ့ရတဲ့အကြောင်း',
sub:['Write about moving to another city for a new job. (80-100 words)'],
answer:{en:'Last year, I got a new job in Mandalay, so I had to move from my hometown in Yangon. At first, I felt nervous and excited at the same time. I had to find a new apartment, learn the new city, and adapt to a different environment. The people in Mandalay were very friendly, which made me feel welcome. My new job is interesting and challenging. I have learned many new skills and made good friends at work. Moving to a new city was a big change, but it has been a valuable experience.',my:'ပြီးခဲ့တဲ့နှစ်က ကျွန်တော် မန္တလေးမှာ အလုပ်အသစ်တစ်ခု ရခဲ့တယ်။ ဒါကြောင့် ရန်ကုန်က ကျွန်တော့်ဇာတိမြို့ကနေ ပြောင်းရွှေ့ခဲ့ရတယ်။ အစပိုင်းမှာ စိတ်လှုပ်ရှားပြီး တစ်ချိန်တည်းမှာ စိုးရိမ်ခဲ့တယ်။ တိုက်ခန်းအသစ်ရှာရတယ်၊ မြို့သစ်ကို လေ့လာရတယ်၊ မတူညီတဲ့ ပတ်ဝန်းကျင်နဲ့ လိုက်လျောညီထွေဖြစ်အောင် နေရတယ်။ မန္တလေးက လူတွေ အရမ်းဖော်ရွေတယ်။ ဒါက ကျွန်တော့်ကို ကြိုဆိုခံရတယ်လို့ ခံစားရစေတယ်။ အလုပ်အသစ်က စိတ်ဝင်စားစရာကောင်းပြီး စိန်ခေါ်မှုရှိတယ်။ ကျွမ်းကျင်မှုအသစ်တွေ အများကြီး သင်ယူခဲ့ရပြီး အလုပ်မှာ သူငယ်ချင်းကောင်းတွေ ရခဲ့တယ်။ မြို့သစ်ကို ပြောင်းရွှေ့တာက ကြီးမားတဲ့အပြောင်းအလဲတစ်ခုပါ။ ဒါပေမယ့် တန်ဖိုးရှိတဲ့ အတွေ့အကြုံတစ်ခု ဖြစ်ခဲ့တယ်။'}},

{batch:'9m_exam4',category:'writing',type:'Writing Task (80-100 words)',en:'Maintaining Work-Life Balance',my:'အလုပ်နှင့် ဘဝမျှခြေ ထိန်းသိမ်းခြင်း',
sub:['Write about maintaining work-life balance. (80-100 words)'],
answer:{en:'Maintaining a good work-life balance is essential for both physical and mental health. When we work too much, we can feel stressed, tired, and unhappy. To keep a balance, we should set clear working hours, take regular breaks, and spend quality time with family and friends. We should also do activities we enjoy, such as exercise, reading, or traveling. I try to keep a balance by finishing my work on time and exercising every evening. A balanced life makes us healthier, happier, and more productive at work.',my:'အလုပ်နဲ့ ဘဝမျှခြေကောင်းတစ်ခု ထိန်းသိမ်းခြင်းဟာ ရုပ်ပိုင်းဆိုင်ရာနဲ့ စိတ်ပိုင်းဆိုင်ရာ ကျန်းမာရေးနှစ်မျိုးလုံးအတွက် မရှိမဖြစ်လိုအပ်တယ်။ အလုပ်အလွန်အကျွံလုပ်ရင် စိတ်ဖိစီးမှု၊ ပင်ပန်းနွမ်းနယ်မှုနဲ့ မပျော်ရွှင်မှုတွေ ခံစားရနိုင်တယ်။ မျှခြေထိန်းသိမ်းဖို့ အလုပ်ချိန်တွေကို ရှင်းရှင်းလင်းလင်းသတ်မှတ်ရမယ်၊ ပုံမှန်အနားယူရမယ်၊ မိသားစုနဲ့ သူငယ်ချင်းတွေနဲ့ အရည်အသွေးရှိတဲ့ အချိန်တွေ ကုန်ဆုံးရမယ်။ လေ့ကျင့်ခန်းလုပ်ခြင်း၊ စာဖတ်ခြင်း ဒါမှမဟုတ် ခရီးသွားခြင်းလိုမျိုး ပျော်ရွှင်စရာလှုပ်ရှားမှုတွေလည်း လုပ်သင့်တယ်။ ကျွန်တော် အလုပ်ကို အချိန်မှီပြီးအောင်လုပ်ပြီး ညနေတိုင်း လေ့ကျင့်ခန်းလုပ်ခြင်းဖြင့် မျှခြေထိန်းသိမ်းဖို့ ကြိုးစားတယ်။ မျှခြေရှိတဲ့ဘဝက ကျွန်တော်တို့ကို ပိုကျန်းမာ၊ ပိုပျော်ရွှင်ပြီး အလုပ်မှာ ပိုထိရောက်မှုရှိစေတယ်။'}},

{batch:'9m_exam4',category:'safety',type:'Listening Practice',en:'Listening: Bridge Officer and Deck Officer - Alarm Report',my:'Listening: Bridge Officer နှင့် Deck Officer - Alarm Report',
sub:['What was the alarm about? / Alarm က ဘာအကြောင်းလဲ?','Who reported the alarm? / Alarm ကို ဘယ်သူ report လုပ်ခဲ့လဲ?','What action was taken? / ဘယ်လိုအရေးယူမှု လုပ်ခဲ့လဲ?'],
answer:{en:'In this listening passage, the Bridge Officer and the Deck Officer are communicating about an alarm on the ship. The Deck Officer reports that a fire alarm has activated in the cargo hold area. The Bridge Officer asks for the exact location and the type of alarm. The Deck Officer confirms it is a smoke detector alarm. The Bridge Officer orders the crew to investigate immediately and report back. This type of communication is very important for ship safety. Clear and accurate reporting helps the crew respond quickly to emergencies and prevent accidents.',my:'ဒီ listening စာပိုဒ်မှာ Bridge Officer နဲ့ Deck Officer တို့ဟာ သင်္ဘောပေါ်က alarm တစ်ခုအကြောင်း ဆက်သွယ်ပြောဆိုနေကြတယ်။ Deck Officer က cargo hold ဧရိယာမှာ မီးသတိပေးသံ မြည်နေတယ်လို့ report လုပ်တယ်။ Bridge Officer က တိကျတဲ့တည်နေရာနဲ့ alarm အမျိုးအစားကို မေးတယ်။ Deck Officer က ဒါက smoke detector alarm ဖြစ်တယ်လို့ အတည်ပြုတယ်။ Bridge Officer က အမှုထမ်းတွေကို ချက်ချင်းစစ်ဆေးပြီး ပြန်လည်သတင်းပို့ဖို့ အမိန့်ပေးတယ်။ ဒီလိုဆက်သွယ်ပြောဆိုမှုဟာ သင်္ဘောဘေးကင်းရေးအတွက် အလွန်အရေးကြီးတယ်။ ရှင်းလင်းတိကျတဲ့ report ပေးခြင်းက အမှုထမ်းတွေကို အရေးပေါ်အခြေအနေတွေကို လျင်မြန်စွာ တုံ့ပြန်နိုင်စေပြီး မတော်တဆမှုတွေကို ကာကွယ်ပေးတယ်။'}},

/* ===== 10M ===== */
{batch:'10m',category:'speaking',type:'Speaking (Picture Description)',en:'Swimming',my:'ရေကူးခြင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What are the people doing? / လူတွေ ဘာလုပ်နေကြလဲ?','Why is swimming good for our health? / ဘာကြောင့်ကောင်းသလဲ?'],
answer:{en:'In the picture, I can see people swimming in a pool. They are enjoying the activity. Swimming is good for our health because it exercises the whole body, improves fitness, and helps reduce stress. It is also a useful life skill.',my:'ပုံထဲမှာ လူတွေ ရေကူးကန်ထဲမှာ ရေကူးနေကြတာကို မြင်ရတယ်။ သူတို့က လှုပ်ရှားမှုကို ပျော်ပျော်ရွှင်ရွှင် လုပ်နေကြတယ်။ ရေကူးတာက ကိုယ်ခန္ဓာတစ်ခုလုံးကို လေ့ကျင့်ပေးပြီး ကျန်းမာကြံ့ခိုင်မှုကို ကောင်းစေတဲ့အပြင် စိတ်ဖိစီးမှုကိုလည်း လျှော့ချပေးလို့ ကျန်းမာရေးအတွက် ကောင်းပါတယ်။ အသုံးဝင်တဲ့ life skill တစ်ခုလည်း ဖြစ်ပါတယ်။'}},

{batch:'10m',category:'speaking',type:'Speaking (Picture Description)',en:'Fire Extinguisher',my:'မီးသတ်ဆေးဘူး အသုံးပြုခြင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What is the person doing? / လူက ဘာလုပ်နေသလဲ?','How do you use a fire extinguisher? / ဘယ်လိုအသုံးပြုမလဲ?','Why is fire safety important? / ဘာကြောင့်အရေးကြီးသလဲ?'],
answer:{en:'In the picture, I can see a person using a fire extinguisher. The basic steps are PASS: Pull the pin, Aim at the base of the fire, Squeeze the handle, and Sweep from side to side. Fire safety is important because a small fire can spread quickly and cause serious damage.',my:'ပုံထဲမှာ လူတစ်ယောက် မီးသတ်ဆေးဘူးကို အသုံးပြုပြီး မီးငြှိမ်းသတ်နေတာကို မြင်ရတယ်။ အခြေခံအဆင့်တွေကို PASS လို့ မှတ်နိုင်တယ် — Pull, Aim, Squeeze, Sweep။ မီးဘေးလုံခြုံရေးက အရေးကြီးတယ်၊ မီးက လျင်မြန်စွာ ပျံ့နှံ့ပြီး လူနဲ့ပစ္စည်းတွေကို ထိခိုက်စေနိုင်လို့ပါ။'}},

{batch:'10m',category:'speaking',type:'Speaking (Picture Description)',en:'Prepare to Travel',my:'ခရီးသွားရန် ပြင်ဆင်ခြင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','What things do you prepare before travelling? / ခရီးမထွက်ခင် ဘာတွေပြင်ဆင်လဲ?','Where would you like to travel? / ဘယ်နေရာကို ခရီးသွားချင်လဲ?','What do you always take when you travel? / ဘာတွေကို အမြဲယူသွားလဲ?'],
answer:{en:'In the picture, I can see a person preparing luggage for a trip. Before travelling, I check my passport, tickets, clothes, money, phone charger, and other important items. I would like to travel to Japan because I want to see its culture and beautiful places. I always take my passport, phone, charger, and basic medicine.',my:'ပုံထဲမှာ လူတစ်ယောက် ခရီးသွားဖို့ အိတ်ပြင်ဆင်နေတာကို မြင်ရတယ်။ ခရီးမထွက်ခင် နိုင်ငံကူးလက်မှတ်၊ လက်မှတ်၊ အဝတ်အစား၊ ငွေ၊ ဖုန်းအားသွင်းကြိုးနဲ့ အရေးကြီးတဲ့ပစ္စည်းတွေကို စစ်ဆေးတတ်တယ်။ ဂျပန်ကို သွားချင်တယ်။ ခရီးသွားတိုင်း နိုင်ငံကူးလက်မှတ်၊ ဖုန်း၊ charger နဲ့ အခြေခံဆေးဝါးတွေ ယူသွားတယ်။'}},

{batch:'10m',category:'speaking',type:'Speaking (Picture Description)',en:'Drinking Water',my:'ရေသောက်ခြင်း',
sub:['What do you see in the picture? / ပုံထဲမှာ ဘာတွေမြင်ရလဲ?','How much water do you drink every day? / နေ့တိုင်း ရေဘယ်လောက်သောက်လဲ?','Why is drinking enough water important? / ဘာကြောင့်အရေးကြီးသလဲ?','What happens if we do not drink enough water? / ရေမလုံလောက်ရင် ဘာဖြစ်နိုင်လဲ?'],
answer:{en:'In the picture, I can see a person drinking a glass of water. I try to drink enough water every day. Water helps our body work properly and keeps us hydrated. If we do not drink enough water, we may feel tired, thirsty, or dehydrated.',my:'ပုံထဲမှာ လူတစ်ယောက် ရေတစ်ခွက်သောက်နေတာကို မြင်ရတယ်။ နေ့တိုင်း ရေလုံလောက်အောင် သောက်ဖို့ ကြိုးစားတယ်။ ရေက ခန္ဓာကိုယ်ကို ပုံမှန်အလုပ်လုပ်စေပြီး ရေဓာတ်မခန်းခြောက်အောင် ကူညီပေးတယ်။ ရေမလုံလောက်ရင် ပင်ပန်းတာ၊ ရေဆာတာ ဒါမှမဟုတ် ရေဓာတ်ခမ်းခြောက်တာ ဖြစ်နိုင်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Junk Food',my:'Junk Food',
sub:['Do you think junk food is good or bad for our health? / Junk food က ကျန်းမာရေးအတွက် ကောင်းလား မကောင်းလား?','How often do you eat junk food? / ဘယ်လောက်မကြာခဏ စားလဲ?','What are the disadvantages of eating too much junk food? / ဘာဆိုးကျိုးတွေရှိလဲ?'],
answer:{en:'I think junk food is unhealthy if we eat too much of it. I sometimes eat fast food, but I try not to eat it every day. Eating too much junk food can cause weight gain and other health problems. We should eat more fruits, vegetables, and balanced meals.',my:'Junk food ကို အလွန်အကျွံစားရင် ကျန်းမာရေးအတွက် မကောင်းဘူးလို့ ထင်တယ်။ တစ်ခါတလေ fast food စားပေမယ့် နေ့တိုင်းတော့ မစားဖို့ ကြိုးစားတယ်။ Junk food အများကြီးစားရင် ကိုယ်အလေးချိန်တက်တာနဲ့ အခြားကျန်းမာရေးပြဿနာတွေ ဖြစ်နိုင်တယ်။ သစ်သီး၊ ဟင်းသီးဟင်းရွက်နဲ့ အာဟာရမျှတတဲ့အစားအစာတွေ ပိုစားသင့်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Best Friend',my:'အကောင်းဆုံးသူငယ်ချင်း',
sub:['Who is your best friend? / အကောင်းဆုံးသူငယ်ချင်းက ဘယ်သူလဲ?','Why is he/she your best friend? / ဘာကြောင့် သတ်မှတ်လဲ?','What do you usually do together? / အတူတူ ဘာတွေလုပ်လေ့ရှိလဲ?','What qualities should a good friend have? / သူငယ်ချင်းကောင်းတစ်ယောက်မှာ ဘယ်လိုအရည်အသွေးတွေ ရှိသင့်လဲ?'],
answer:{en:'My best friend is someone I can trust and talk to openly. We usually study, eat, or spend free time together. A good friend should be honest, kind, helpful, and trustworthy.',my:'ကျွန်တော့်အကောင်းဆုံးသူငယ်ချင်းက ယုံကြည်ပြီး ပွင့်ပွင့်လင်းလင်း စကားပြောလို့ရတဲ့သူပါ။ ကျွန်တော်တို့ အတူတူစာလေ့လာတာ၊ အစားစားတာ ဒါမှမဟုတ် အားချိန်ကုန်ဆုံးတာတွေ လုပ်လေ့ရှိတယ်။ သူငယ်ချင်းကောင်းတစ်ယောက်မှာ ရိုးသားမှု၊ ကြင်နာမှု၊ ကူညီတတ်မှုနဲ့ ယုံကြည်စိတ်ချရမှုတွေ ရှိသင့်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Communication Apps',my:'Communication Apps',
sub:['What communication apps do you use? / ဘယ် communication app တွေ သုံးလဲ?','How do communication apps help people? / ဘယ်လိုကူညီလဲ?','What are the advantages and disadvantages? / အားသာချက်နဲ့ အားနည်းချက်တွေက ဘာတွေလဲ?'],
answer:{en:'I usually use Messenger, Viber, and Telegram. They help me communicate quickly with my family, friends, and coworkers. The advantages are speed, convenience, and easy communication over long distances. However, people may spend too much time on their phones and may face privacy or security problems. We should use these apps responsibly.',my:'ကျွန်တော် Messenger, Viber နဲ့ Telegram တွေကို အများဆုံးသုံးတယ်။ မိသားစု၊ သူငယ်ချင်းနဲ့ လုပ်ဖော်ကိုင်ဖက်တွေနဲ့ မြန်မြန်ဆန်ဆန် ဆက်သွယ်နိုင်အောင် ကူညီပေးတယ်။ အားသာချက်က မြန်ဆန်မှုနဲ့ အဆင်ပြေမှုပါ။ ဒါပေမယ့် ဖုန်းကို အချိန်အများကြီးသုံးမိတာနဲ့ privacy/security ပြဿနာတွေ ရှိနိုင်တယ်။ တာဝန်ယူမှုရှိရှိ အသုံးပြုသင့်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Clothes',my:'အဝတ်အစား',
sub:['What kind of clothes do you usually wear? / ဘယ်လိုအဝတ်အစားတွေ ဝတ်လဲ?','What clothes do you like most? / ဘယ်လိုအဝတ်အစားတွေကို အကြိုက်ဆုံးလဲ?','Why is it important to wear suitable clothes? / ဘာကြောင့်အရေးကြီးလဲ?','Do you prefer comfortable or fashionable clothes? Why? / ဘယ်ဟာပိုကြိုက်လဲ?'],
answer:{en:'I usually wear simple and comfortable clothes. I like T-shirts, jeans, and casual shirts. Wearing suitable clothes is important because different situations require different clothing. I prefer comfortable clothes because they help me feel relaxed, but I also try to look neat and appropriate.',my:'ကျွန်တော် ရိုးရှင်းပြီး သက်တောင့်သက်သာရှိတဲ့ အဝတ်အစားတွေ ဝတ်တယ်။ T-shirt, jeans နဲ့ casual shirt တွေကို ကြိုက်တယ်။ အခြေအနေအလိုက် သင့်တော်တဲ့အဝတ်အစားတွေ လိုအပ်လို့ သင့်တော်အောင် ဝတ်ဖို့ အရေးကြီးတယ်။ ကျွန်တော်က သက်တောင့်သက်သာရှိတာကို ပိုကြိုက်ပေမယ့် သပ်ရပ်ပြီး သင့်တော်အောင်လည်း ဝတ်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Online Shopping – Saves Time',my:'Online Shopping – အချိန်သက်သာစေခြင်း',
sub:['Do you think online shopping saves time? / အချိန်သက်သာစေတယ်လို့ ထင်လား?','Why do people like shopping online? / ဘာကြောင့် online shopping ကြိုက်ကြလဲ?','What are the advantages and disadvantages? / အားသာချက်နဲ့ အားနည်းချက်တွေက ဘာတွေလဲ?','Do you prefer online or in-store? Why? / ဘယ်ဟာပိုကြိုက်လဲ?'],
answer:{en:'Yes, online shopping saves time because we can buy things without travelling to a store. We can compare prices, read reviews, and order from home. However, we cannot always check quality directly and delivery may take time. I prefer online shopping for simple items, but I visit a store when I need to see the product first.',my:'ဟုတ်ကဲ့၊ online shopping က အချိန်သက်သာစေတယ်။ ဆိုင်ကိုသွားစရာမလိုဘဲ အိမ်ကနေ ပစ္စည်းဝယ်နိုင်လို့ပါ။ ဈေးနှုန်းနှိုင်းယှဉ်နိုင်တယ်၊ review ဖတ်နိုင်တယ်၊ အိမ်ကနေ order လုပ်နိုင်တယ်။ ဒါပေမယ့် အရည်အသွေးကို တိုက်ရိုက်မစစ်နိုင်တာနဲ့ delivery ကြာနိုင်တာတွေ ရှိတယ်။ ရိုးရှင်းတဲ့ပစ္စည်းတွေအတွက် online shopping ကို ပိုကြိုက်တယ်။'}},

{batch:'10m',category:'debate',type:'Speaking (Debate / Discussion)',en:'Using the Internet Too Much These Days',my:'ယနေ့ခေတ် Internet ကို အလွန်အကျွံအသုံးပြုခြင်း',
sub:['Do you think people use the Internet too much these days? / လူတွေ Internet ကို အလွန်အကျွံသုံးနေကြတယ်လို့ ထင်လား?','How much time do you spend on the Internet every day? / နေ့တိုင်း ဘယ်လောက်ကြာကြာသုံးလဲ?','What are the advantages and disadvantages? / အားသာချက်နဲ့ အားနည်းချက်တွေက ဘာတွေလဲ?','How can we reduce screen time? / ဘယ်လိုလျှော့ချနိုင်လဲ?'],
answer:{en:'Yes, I think many people use the Internet too much these days. I use it every day for study, communication, news, and entertainment. It gives us quick access to information, but too much use can waste time and affect sleep, concentration, and real-life communication. We can reduce screen time by setting limits, taking breaks, exercising, and spending more time with family.',my:'ဟုတ်ကဲ့၊ ယနေ့ခေတ်မှာ လူအများအပြား Internet ကို အလွန်အကျွံသုံးနေကြတယ်လို့ ထင်တယ်။ ကျွန်တော်က စာလေ့လာဖို့၊ ဆက်သွယ်ဖို့၊ သတင်းဖတ်ဖို့နဲ့ အပန်းဖြေဖို့ နေ့တိုင်းသုံးတယ်။ အချက်အလက်ကို မြန်မြန်ရစေပေမယ့် အလွန်အကျွံသုံးရင် အချိန်ဖြုန်းမိနိုင်ပြီး အိပ်စက်မှု၊ အာရုံစူးစိုက်မှုနဲ့ လက်တွေ့ဆက်ဆံရေးကို ထိခိုက်နိုင်တယ်။ Screen time ကို ကန့်သတ်တာ၊ နားတာ၊ လေ့ကျင့်ခန်းလုပ်တာနဲ့ မိသားစုအတွက် အချိန်ပိုပေးတာက ကူညီနိုင်တယ်။'}},

{batch:'10m',category:'grammar',type:'Grammar Practical Exercise',en:'Grammar Practice — 4 Useful Structures',my:'Grammar လက်တွေ့လေ့ကျင့်ခန်း — Structure ၄ မျိုး',
sub:['interested + in + V-ing / Noun','am/is/are + V-ing','has/have + V3','Remember + to + V1'],
exercises:['1) I am interested in ______ (learn) English.','2) They ______ (study) English now.','3) She ______ already ______ (finish) her homework.','4) Remember ______ (bring) your passport.','5) Make a sentence using "interested in + V-ing".','6) Make a sentence using Present Continuous.'],
practiceAnswers:['1) learning','2) are studying','3) has / finished','4) to bring','5) Example: I am interested in learning English.','6) Example: I am studying English now.'],
answer:{en:'Use interested in + V-ing/Noun; am/is/are + V-ing for actions happening now; has/have + V3 for present perfect; remember + to + V1 for reminders.',my:'မှတ်ရန် — interested in နောက်မှာ noun/V-ing သုံးပါ။ အခုဖြစ်နေတဲ့အလုပ်မှာ am/is/are + V-ing သုံးပါ။ Present Perfect မှာ has/have + V3 သုံးပါ။ သတိပေးရာမှာ remember + to + V1 သုံးပါ။'}}
];

/* ══ Filter out listening ══ */
const data = questionsData.filter(q => !String(q.type||'').toLowerCase().includes('listening'));

/* ══ Follow-ups ══ */
const follow = {
  'Swimming':['How often do you go swimming? / ဘယ်လောက်မကြာခဏ ရေကူးလဲ?','Do you prefer a pool or the beach? Why? / ဘယ်ဟာပိုကြိုက်လဲ?','What safety rules should swimmers follow? / ဘယ် safety rules တွေလိုက်နာသင့်လဲ?'],
  'Fire Extinguisher':['Where can you find fire extinguishers? / ဘယ်မှာရှိလဲ?','What should you do first when you discover a fire? / ပထမဆုံး ဘာလုပ်မလဲ?','Who should you inform during a fire emergency? / ဘယ်သူ့ကို အကြောင်းကြားမလဲ?'],
  'Prepare to Travel':['How do you check your travel documents? / ဘယ်လိုစစ်မလဲ?','What should you do if you lose your passport? / ဘာလုပ်မလဲ?','Do you prefer travelling alone or with friends? Why? / ဘယ်ဟာပိုကြိုက်လဲ?'],
  'Drinking Water':['When do you drink more water? / ဘယ်အချိန်မှာ ပိုသောက်လဲ?','Do you prefer cold water or room-temperature water? / ဘယ်ဟာပိုကြိုက်လဲ?','What healthy habits can you combine with drinking enough water? / ဘယ်အလေ့အထတွေနဲ့ တွဲလုပ်နိုင်လဲ?']
};

/* ══ Labels ══ */
const cl = {speaking:'Speaking',debate:'Debate',personal:'Personal',safety:'Safety',grammar:'Grammar',writing:'Writing'};

function bl(x){
  if(x==='all') return 'All';
  if(x==='10m') return '10M';
  const m = x.match(/^(\d+)m_exam(\d+)$/);
  if(m) return `${m[1]}M Exam ${m[2]}`;
  return x;
}

/* ══ State ══ */
let st = {b:'all', c:'all', s:'', open:false};

/* ══ Compute available batches / categories ══ */
const availableBatches = [...new Set(data.map(q=>q.batch))];
const availableCategories = [...new Set(data.map(q=>q.category))];

const batchOrder = ['7m_exam1','7m_exam2','7m_exam3','7m_exam4','8m_exam1','8m_exam2','8m_exam3','9m_exam1','9m_exam4','10m'];
const categoryOrder = ['speaking','debate','personal','safety','grammar','writing'];

/* ══ DOM refs ══ */
const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const countBadge = document.getElementById('countBadge');
const batchBtn = document.getElementById('batchBtn');
const catBtn = document.getElementById('catBtn');
const batchLabel = document.getElementById('batchLabel');
const catLabel = document.getElementById('catLabel');
const expandBtn = document.getElementById('expandBtn');
const expandLabel = document.getElementById('expandLabel');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheetTitle');
const sheetList = document.getElementById('sheetList');
const fabTop = document.getElementById('fabTop');

/* ══ Sheet state ══ */
let sheetMode = null;

function openSheet(mode){
  sheetMode = mode;
  if(mode === 'batch'){
    sheetTitle.textContent = 'Select Batch';
    const items = ['all', ...batchOrder.filter(b => availableBatches.includes(b))];
    sheetList.innerHTML = items.map(x => {
      const count = x === 'all' ? data.length : data.filter(q => q.batch === x).length;
      const active = st.b === x;
      return `<button class="${active?'active':''}" onclick="selectFromSheet('${x}')">${bl(x)}<span class="count">${count}</span></button>`;
    }).join('');
  } else {
    sheetTitle.textContent = 'Select Topic';
    const items = ['all', ...categoryOrder.filter(c => availableCategories.includes(c))];
    sheetList.innerHTML = items.map(x => {
      const count = x === 'all' ? data.length : data.filter(q => q.category === x).length;
      const active = st.c === x;
      const label = x === 'all' ? 'All Topics' : (cl[x] || x);
      return `<button class="${active?'active':''}" onclick="selectFromSheet('${x}')">${label}<span class="count">${count}</span></button>`;
    }).join('');
  }
  overlay.classList.add('show');
  sheet.classList.add('show');
}

function closeSheet(){
  overlay.classList.remove('show');
  sheet.classList.remove('show');
}

function selectFromSheet(x){
  if(sheetMode === 'batch') st.b = x;
  else st.c = x;
  closeSheet();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ══ Rendering ══ */
function card(q){
  const qs = (q.sub||[]).map((x,i)=>`<div class="q"><strong>${i+1}</strong>${x}</div>`).join('');
  const fu = (follow[q.en]||[]).map((x,i)=>`<div class="q"><strong>F${i+1}</strong>${x}</div>`).join('');
  const f = fu ? `<div class="exercise"><h4>↪ Picture Follow-up</h4>${fu}</div>` : '';
  const ex = q.exercises ? `<div class="exercise">
    <h4>🧩 Practical Grammar Exercise</h4>
    <ol>${q.exercises.map(x=>`<li>${x}</li>`).join('')}</ol>
    <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">Show exercise answers</button>
    <div class="practice">${q.practiceAnswers.join('<br>')}</div>
  </div>` : '';
  const a = q.answer ? `<div class="answer">
    <button class="answer-btn" onclick="this.nextElementSibling.classList.toggle('show')">👁 Show / Hide Answer</button>
    <div class="answerbox ${st.open?'show':''}">
      <div class="lang en"><b>EN</b>${q.answer.en}</div>
      <div class="lang my"><b>မြန်မာ</b>${q.answer.my}</div>
    </div>
  </div>` : '';

  return `<article class="card">
    <div class="meta">
      <span class="tag">${bl(q.batch)}</span>
      <span class="tag cat">${cl[q.category]||q.category}</span>
    </div>
    <div class="title">${q.en}</div>
    <div class="mytitle">${q.my||''}</div>
    <div class="qs">${qs}</div>
    ${f}${ex}${a}
  </article>`;
}

function getFiltered(){
  const s = st.s.toLowerCase().trim();
  return data.filter(q =>
    (st.b === 'all' || q.batch === st.b) &&
    (st.c === 'all' || q.category === st.c) &&
    (!s || JSON.stringify(q).toLowerCase().includes(s))
  );
}

function updateHeader(){
  const hasFilters = st.b !== 'all' || st.c !== 'all' || st.s.trim() !== '';
  const filtered = getFiltered();
  countBadge.textContent = hasFilters ? `${filtered.length} ×` : filtered.length;
  countBadge.classList.toggle('clearable', hasFilters);

  batchLabel.textContent = st.b === 'all' ? 'Batches' : bl(st.b);
  catLabel.textContent = st.c === 'all' ? 'Topics' : (cl[st.c] || st.c);
  batchBtn.classList.toggle('active', st.b !== 'all');
  catBtn.classList.toggle('active', st.c !== 'all');
  expandBtn.classList.toggle('on', st.open);
  expandLabel.textContent = st.open ? 'Close' : 'Open';
}

function render(){
  const filtered = getFiltered();
  updateHeader();

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty"><span class="big">🔎</span>No matching questions.<br><small>Search / filter ကို ပြန်စမ်းကြည့်ပါ။</small></div>`;
  } else {
    grid.innerHTML = filtered.map(card).join('');
  }
}

function resetAll(){
  st = {b:'all', c:'all', s:'', open:false};
  searchInput.value = '';
  render();
}

/* ══ Events ══ */
searchInput.addEventListener('input', e => {
  st.s = e.target.value;
  render();
});

batchBtn.addEventListener('click', () => openSheet('batch'));
catBtn.addEventListener('click', () => openSheet('cat'));

expandBtn.addEventListener('click', () => {
  st.open = !st.open;
  render();
});

countBadge.addEventListener('click', () => {
  if(st.b !== 'all' || st.c !== 'all' || st.s.trim() !== '') resetAll();
});

overlay.addEventListener('click', closeSheet);

/* Close sheet with swipe-down handle? (simple: tap overlay) */

/* Scroll top FAB */
window.addEventListener('scroll', () => {
  fabTop.classList.toggle('show', window.scrollY > 400);
}, {passive:true});

fabTop.addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ══ Init ══ */
render();
</script>
</body>
</html>
