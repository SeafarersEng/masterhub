<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Old Questions - MEPT Master Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Myanmar Text', system-ui, sans-serif;
        }

        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 12px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: #1a4d8f;
            color: white;
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(26, 77, 143, 0.25);
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        .top-bar h1 i {
            font-size: 22px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 50px;
            transition: 0.2s;
            text-align: center;
        }

        .back-link:active {
            background: rgba(255, 255, 255, 0.30);
            transform: scale(0.97);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* ===== FILTER BOX ===== */
        .filter-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 14px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .filter-box .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
        }

        .filter-box .search-input:focus {
            border-color: #1a4d8f;
            box-shadow: 0 0 0 4px rgba(26, 77, 143, 0.08);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .filter-btn,
        .cat-btn {
            padding: 5px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            background: #fff;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .filter-btn:active,
        .cat-btn:active {
            transform: scale(0.95);
        }

        .filter-btn:hover,
        .cat-btn:hover {
            border-color: #1a4d8f;
            color: #1a4d8f;
        }

        .filter-btn.active,
        .cat-btn.active {
            background: #1a4d8f;
            border-color: #1a4d8f;
            color: #fff;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 2px;
        }

        /* ===== QUESTION LIST ===== */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #1a4d8f;
            transition: 0.2s;
        }

        .question-card:active {
            transform: scale(0.99);
        }

        .question-card .type {
            font-size: 11px;
            font-weight: 700;
            color: #1a4d8f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .question-card .batch-tag {
            display: inline-block;
            background: #e8edf5;
            color: #1a4d8f;
            padding: 1px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 4px;
        }

        .question-card .category-tag {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 1px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        .question-card .en {
            font-size: 15px;
            font-weight: 700;
            color: #0a2a4a;
            margin-top: 8px;
            line-height: 1.4;
        }

        .question-card .my {
            font-size: 14px;
            color: #475569;
            margin-top: 4px;
            padding: 6px 10px;
            background: #f8fafc;
            border-radius: 8px;
            line-height: 1.5;
        }

        .question-card .sub-details {
            list-style: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e8edf5;
        }

        .question-card .sub-details li {
            padding: 3px 0;
            font-size: 13px;
            color: #1f3a5f;
            border-bottom: 1px dashed #e8edf5;
            line-height: 1.5;
        }

        .question-card .sub-details li:last-child {
            border-bottom: none;
        }

        .question-card .sub-details li::before {
            content: "▸ ";
            color: #1a4d8f;
            font-weight: 700;
        }

        /* ===== ANSWER SECTION ===== */
        .answer-section {
            margin-top: 12px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 12px;
        }

        .answer-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #0a2a4a;
            font-size: 13px;
        }

        .toggle-btn {
            background: #1a4d8f;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .toggle-btn:active {
            background: #0f3a6b;
            transform: scale(0.95);
        }

        .answer-content {
            display: none;
            margin-top: 10px;
            background: #f0f7ff;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #d4e2f0;
            gap: 10px;
            flex-direction: column;
        }

        .answer-content.show {
            display: flex;
        }

        .answer-content .en-answer {
            font-size: 14px;
            color: #0a2a4a;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 8px;
            border-left: 4px solid #1a4d8f;
            line-height: 1.7;
        }

        .answer-content .my-answer {
            font-size: 14px;
            color: #1f3a5f;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 8px;
            border-left: 4px solid #d4891e;
            line-height: 1.7;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        .empty-state i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ===== STATS ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .stats-bar .stat-item {
            font-size: 13px;
            color: #475569;
        }

        .stats-bar .stat-item strong {
            color: #0a2a4a;
        }

        .stats-bar .stat-item i {
            color: #1a4d8f;
            margin-right: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .filter-btn,
            .cat-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .question-card {
                padding: 14px 14px;
            }
            .question-card .en {
                font-size: 14px;
            }
            .question-card .my {
                font-size: 13px;
            }
            .answer-content .en-answer,
            .answer-content .my-answer {
                font-size: 13px;
            }
        }

        @media (max-width: 380px) {
            .filter-group {
                gap: 4px;
            }
            .filter-btn,
            .cat-btn {
                font-size: 10px;
                padding: 3px 8px;
            }
            .top-bar h1 {
                font-size: 16px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f4f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8c9e0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8aa3c0;
        }
    </style>
</head>

        // ============================================================
        // 2. RENDER FUNCTION
        // ============================================================
        function renderQuestions(batch, category, searchTerm) {
            const container = document.getElementById('questionList');
            let filtered = questionsData;

            if (batch && batch !== 'all') {
                filtered = filtered.filter(q => q.batch === batch);
            }

            if (category && category !== 'all') {
                filtered = filtered.filter(q => q.category === category);
            }

            if (searchTerm && searchTerm.trim() !== '') {
                const term = searchTerm.trim().toLowerCase();
                filtered = filtered.filter(q =>
                    q.en.toLowerCase().includes(term) ||
                    q.my.includes(term) ||
                    q.type.toLowerCase().includes(term) ||
                    (q.sub && q.sub.some(s => s.toLowerCase().includes(term))) ||
                    (q.answer && q.answer.en.toLowerCase().includes(term)) ||
                    (q.answer && q.answer.my.includes(term))
                );
            }

            document.getElementById('totalCount').textContent = filtered.length;
            const withAnswers = filtered.filter(q => q.answer !== undefined).length;
            document.getElementById('answerCount').textContent = withAnswers;
            const uniqueBatches = new Set(filtered.map(q => q.batch));
            document.getElementById('batchCount').textContent = uniqueBatches.size;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        ဤရွေးချယ်မှုအတွက် မေးခွန်းမရှိသေးပါ။
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((q, index) => {
                const batchName = getBatchName(q.batch);
                const categoryName = getCategoryName(q.category);
                const hasAnswer = q.answer !== undefined;
                const answerId = `answer_${index}_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;

                html += `
                    <div class="question-card">
                        <div class="type">${q.type}</div>
                        <span class="batch-tag">${batchName}</span>
                        <span class="category-tag">${categoryName}</span>
                        <div class="en">📘 ${q.en}</div>
                        <div class="my">📗 ${q.my}</div>
                        ${q.sub ? `<ul class="sub-details">${q.sub.map(s => `<li>${s}</li>`).join('')}</ul>` : ''}
                        ${hasAnswer ? `
                            <div class="answer-section">
                                <div class="answer-label">
                                    📝 အဖြေ (Answer Key)
                                    <button class="toggle-btn" onclick="toggleAnswer('${answerId}')">ကြည့်မည်</button>
                                </div>
                                <div id="${answerId}" class="answer-content">
                                    <div class="en-answer">🇬🇧 ${q.answer.en}</div>
                                    <div class="my-answer">🇲🇲 ${q.answer.my}</div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.batch === (batch || 'all'));
            });
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === (category || 'all'));
            });
        }

        function toggleAnswer(answerId) {
            const answerDiv = document.getElementById(answerId);
            if (answerDiv) {
                answerDiv.classList.toggle('show');
                const btn = answerDiv.parentElement.querySelector('.toggle-btn');
                if (btn) {
                    btn.textContent = answerDiv.classList.contains('show') ? 'ပိတ်မည်' : 'ကြည့်မည်';
                }
            }
        }

        function getBatchName(batchCode) {
            const map = {
                '7m_exam1': '7M Exam 1',
                '7m_exam2': '7M Exam 2',
                '7m_exam3': '7M Exam 3',
                '7m_exam4': '7M Exam 4',
                '8m_exam1': '8M Exam 1',
                '8m_exam2': '8M Exam 2'
            };
            return map[batchCode] || batchCode;
        }

        function getCategoryName(catCode) {
            const map = {
                'personal': 'ကိုယ်ရေး',
                'safety': 'လုံခြုံရေး',
                'debate': 'ဆွေးနွေးခြင်း',
                'writing': 'အရေးအသား',
                'speaking': 'စကားပြော'
            };
            return map[catCode] || catCode;
        }

        // ============================================================
        // 3. EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderQuestions('all', 'all', '');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const batch = this.dataset.batch;
                    const category = document.querySelector('.cat-btn.active')?.dataset.category || 'all';
                    const search = document.getElementById('searchInput').value;
                    renderQuestions(batch, category, search);
                });
            });

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.dataset.category;
                    const batch = document.querySelector('.filter-btn.active')?.dataset.batch || 'all';
                    const search = document.getElementById('searchInput').value;
                    renderQuestions(batch, category, search);
                });
            });

            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    const batch = document.querySelector('.filter-btn.active')?.dataset.batch || 'all';
                    const category = document.querySelector('.cat-btn.active')?.dataset.category || 'all';
                    renderQuestions(batch, category, this.value);
                }, 300);
            });
        });

        // ============================================================
        // 4. COPY PROTECTION (basic)
        // ============================================================
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (['c', 'C', 'a', 'A', 'u', 'U', 's', 'S'].includes(e.key)) e.preventDefault();
            }
            if (e.key === 'F12') e.preventDefault();
        });

        console.log('📂 Old Questions loaded successfully!');
        console.log('📚 Total questions:', questionsData.length);
        console.log('✅ Official 8M (၈ လပိုင်း) Questions added successfully!');
    </script>
