<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <title>Debate Practice – MEPT Master Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- ===== LOGIN GUARD: hide content until verified ===== -->
    <script>
        (function () {
            document.documentElement.style.visibility = 'hidden';
            var isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                try { sessionStorage.setItem('redirectAfterLogin', window.location.pathname); } catch (e) {}
                window.location.replace('index.html');
            } else {
                document.documentElement.style.visibility = 'visible';
            }
        })();
    </script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Myanmar Text', system-ui, sans-serif;
        }

        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 12px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: #1a4d8f;
            color: white;
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(26, 77, 143, 0.25);
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
        }

        .top-bar h1 i { font-size: 22px; }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 50px;
            transition: 0.2s;
            text-align: center;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .back-link:active {
            background: rgba(255, 255, 255, 0.30);
            transform: scale(0.97);
        }

        .logout-btn {
            background: rgba(220, 38, 38, 0.85);
        }
        .logout-btn:hover { background: rgba(220, 38, 38, 1); }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* ===== STATS ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .stats-bar .stat-item { font-size: 13px; color: #475569; }
        .stats-bar .stat-item strong { color: #0a2a4a; }
        .stats-bar .stat-item i { color: #1a4d8f; margin-right: 4px; }

        /* ===== FILTER ===== */
        .filter-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 14px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .filter-box .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.25s;
        }

        .filter-box .search-input:focus {
            border-color: #1a4d8f;
            box-shadow: 0 0 0 4px rgba(26, 77, 143, 0.08);
        }

        /* ===== DEBATE CARD ===== */
        .debate-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .debate-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border-left: 6px solid #1a4d8f;
            transition: 0.2s;
        }

        .debate-card:active { transform: scale(0.995); }

        .debate-card .topic-number {
            display: inline-block;
            background: #1a4d8f;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 50px;
            margin-bottom: 8px;
        }

        .debate-card .topic-en {
            font-size: 17px;
            font-weight: 800;
            color: #0a2a4a;
            line-height: 1.4;
            margin-bottom: 2px;
        }

        .debate-card .topic-my {
            font-size: 15px;
            font-weight: 600;
            color: #1a4d8f;
            margin-bottom: 12px;
        }

        .debate-card .question-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            margin-bottom: 14px;
        }

        .debate-card .question-box .q-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .debate-card .question-box .q-text {
            font-size: 14px;
            font-weight: 600;
            color: #0a2a4a;
            line-height: 1.5;
        }

        .debate-card .question-box .q-text-my {
            font-size: 13px;
            color: #475569;
            margin-top: 4px;
            line-height: 1.6;
        }

        /* ===== FOLLOW UP ===== */
        .followup-box {
            background: #fefce8;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #fde68a;
            margin-bottom: 14px;
        }

        .followup-box .f-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #b45309;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .followup-box ul { list-style: none; padding: 0; margin: 0; }

        .followup-box ul li {
            font-size: 13px;
            color: #78350f;
            padding: 3px 0 3px 16px;
            position: relative;
            line-height: 1.5;
        }

        .followup-box ul li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #d97706;
            font-weight: 700;
        }

        /* ===== STEP BY STEP ===== */
        .steps-section { margin-top: 6px; }

        .steps-section .steps-title {
            font-size: 13px;
            font-weight: 700;
            color: #0a2a4a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .steps-section .steps-title i { color: #1a4d8f; }

        .step-item {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            background: #f0f7ff;
            border-radius: 10px;
            padding: 10px 12px;
            border-left: 4px solid #1a4d8f;
        }

        .step-item .step-num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background: #1a4d8f;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .step-item .step-content { flex: 1; }

        .step-item .step-content .step-en {
            font-size: 13px;
            color: #0a2a4a;
            line-height: 1.5;
            font-weight: 500;
        }

        .step-item .step-content .step-my {
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
            margin-top: 2px;
        }

        /* ===== ANSWER TOGGLE ===== */
        .answer-toggle {
            margin-top: 12px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 12px;
        }

        .toggle-btn {
            background: #1a4d8f;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
            touch-action: manipulation;
        }

        .toggle-btn:active {
            background: #0f3a6b;
            transform: scale(0.97);
        }

        .full-answer {
            display: none;
            margin-top: 12px;
            background: #f0f7ff;
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid #d4e2f0;
            gap: 10px;
            flex-direction: column;
        }

        .full-answer.show { display: flex; }

        .full-answer .en-answer {
            font-size: 14px;
            color: #0a2a4a;
            padding: 10px 12px;
            background: #ffffff;
            border-radius: 8px;
            border-left: 4px solid #1a4d8f;
            line-height: 1.8;
        }

        .full-answer .my-answer {
            font-size: 14px;
            color: #1f3a5f;
            padding: 10px 12px;
            background: #ffffff;
            border-radius: 8px;
            border-left: 4px solid #d4891e;
            line-height: 1.8;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        .empty-state i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .debate-card { padding: 16px 14px; }
            .debate-card .topic-en { font-size: 15px; }
            .debate-card .topic-my { font-size: 14px; }
            .step-item .step-content .step-en,
            .step-item .step-content .step-my { font-size: 12px; }
            .full-answer .en-answer,
            .full-answer .my-answer { font-size: 13px; }
        }

        @media (max-width: 380px) {
            .top-bar h1 { font-size: 16px; }
            .debate-card .topic-en { font-size: 14px; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f0f4f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b8c9e0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8aa3c0; }

        /* ===== MEPT MASTER HUB — PREMIUM UI OVERRIDE ===== */
        :root{
            --bg:#f5f7fb;
            --surface:rgba(255,255,255,.92);
            --surface-solid:#fff;
            --text:#152238;
            --muted:#68758a;
            --line:#e7ebf2;
            --primary:#315bea;
            --primary-2:#6948e8;
            --primary-soft:#eef2ff;
            --success:#13a673;
            --shadow:0 10px 35px rgba(27,42,74,.08);
            --shadow-hover:0 18px 45px rgba(27,42,74,.13);
            --radius:22px;
        }
        html{scroll-behavior:smooth}
        body{
            background:
                radial-gradient(circle at 5% 0%,rgba(49,91,234,.10),transparent 28rem),
                radial-gradient(circle at 95% 8%,rgba(105,72,232,.09),transparent 30rem),
                var(--bg) !important;
            color:var(--text);
            font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Myanmar",sans-serif;
        }
        .top-bar{
            position:sticky !important;
            top:0;
            z-index:1000;
            background:rgba(15,27,52,.92) !important;
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            box-shadow:0 8px 30px rgba(15,27,52,.18) !important;
            border-bottom:1px solid rgba(255,255,255,.10);
        }
        .top-bar h1{letter-spacing:-.025em;font-weight:800 !important;}
        .top-bar a, .top-bar .back-link{
            border:1px solid rgba(255,255,255,.14);
            background:rgba(255,255,255,.08);
            border-radius:12px;
            padding:9px 13px !important;
            transition:.2s ease;
        }
        .top-bar a:hover, .top-bar .back-link:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
        .top-bar .logout-btn{
            background:rgba(220,38,38,.85) !important;
            border-color:rgba(255,255,255,.14) !important;
        }
        .top-bar .logout-btn:hover{background:rgba(220,38,38,1) !important;}
        .stats-bar{
            display:grid !important;
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:14px !important;
            margin:22px 0 !important;
        }
        .stat-item{
            background:var(--surface) !important;
            border:1px solid var(--line) !important;
            border-radius:18px !important;
            box-shadow:var(--shadow) !important;
            padding:16px 18px !important;
            transition:.2s ease;
        }
        .stat-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover) !important}
        .stat-item strong{font-size:22px !important;font-weight:850 !important;color:var(--primary) !important;}
        .filter-box{
            background:rgba(255,255,255,.94) !important;
            border:1px solid var(--line) !important;
            border-radius:16px !important;
            box-shadow:var(--shadow) !important;
        }
        .filter-box .search-input{
            border:1px solid #dfe5ef !important;
            background:#fff !important;
            border-radius:16px !important;
            box-shadow:0 8px 25px rgba(27,42,74,.07) !important;
            min-height:52px;
            padding:0 18px 0 48px !important;
            font-size:15px !important;
        }
        .filter-box .search-input:focus{
            border-color:rgba(49,91,234,.55) !important;
            box-shadow:0 0 0 4px rgba(49,91,234,.10),0 10px 30px rgba(27,42,74,.08) !important;
        }
        .debate-card{
            background:var(--surface-solid) !important;
            border:1px solid var(--line) !important;
            border-radius:var(--radius) !important;
            box-shadow:var(--shadow) !important;
            overflow:hidden;
            transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
        }
        .debate-card:hover{
            transform:translateY(-3px);
            box-shadow:var(--shadow-hover) !important;
            border-color:#d9e0ee !important;
        }
        .debate-card + .debate-card{margin-top:16px !important}
        .debate-card .topic-number{
            background:var(--primary-soft) !important;
            color:#3d50bd !important;
            border:1px solid #dce3ff;
            border-radius:999px !important;
            padding:5px 10px !important;
            font-size:11px !important;
            font-weight:800 !important;
            letter-spacing:.02em;
        }
        .debate-card .topic-en{
            font-size:18px !important;
            line-height:1.55 !important;
            font-weight:800 !important;
            letter-spacing:-.015em;
        }
        .debate-card .topic-my{
            line-height:1.85 !important;
            font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;
        }
        .followup-box{
            background:#f8faff !important;
            border:1px solid #e8edfb !important;
            border-radius:16px !important;
            padding:14px 16px !important;
        }
        .step-item{
            background:#fbfcfe !important;
            border:1px solid var(--line) !important;
            border-radius:14px !important;
            padding:13px 15px !important;
        }
        .toggle-btn{
            background:linear-gradient(135deg,var(--primary),var(--primary-2)) !important;
            border:0 !important;
            box-shadow:0 8px 18px rgba(49,91,234,.22) !important;
            color:#fff !important;
            font-weight:800 !important;
            border-radius:12px !important;
        }
        .toggle-btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
        .full-answer{
            background:linear-gradient(180deg,#f8faff,#fff) !important;
            border:1px solid #e3e8f5 !important;
            border-radius:16px !important;
            line-height:1.8 !important;
        }
        .debate-list{padding-bottom:70px}
        .empty-state{
            background:rgba(255,255,255,.8);
            border:1px dashed #cfd7e7;
            border-radius:20px;
            padding:40px 20px;
            text-align:center;
            color:var(--muted);
        }
        @media (max-width:700px){
            .top-bar h1{font-size:18px !important}
            .stats-bar{gap:9px !important;margin:14px 0 !important}
            .stat-item{padding:12px 10px !important;border-radius:15px !important}
            .stat-item strong{font-size:18px !important}
            .debate-card{border-radius:18px !important}
            .debate-card .topic-en{font-size:16px !important}
        }

        /* ===== DARK MODE ===== */
        #uiThemeToggle{
            margin-left:8px;
            border:1px solid rgba(255,255,255,.16);
            background:rgba(255,255,255,.08);
            color:#fff;
            border-radius:12px;
            min-width:42px;
            height:40px;
            cursor:pointer;
        }
        body.dark-ui{
            --bg:#0b1220; --surface:rgba(18,28,46,.92); --surface-solid:#111c2e;
            --text:#e8eef9; --muted:#9aa8bd; --line:#26344b; --primary-soft:#18264c;
            background:radial-gradient(circle at 10% 0%,rgba(49,91,234,.18),transparent 28rem),#0b1220 !important;
        }
        body.dark-ui .filter-box{background:#111c2e !important;border-color:#2b3a52 !important;}
        body.dark-ui .filter-box .search-input{background:#111c2e !important;color:#eef4ff !important;border-color:#2b3a52 !important}
        body.dark-ui .followup-box{background:#111c2e !important;border-color:#293950 !important}
        body.dark-ui .step-item{background:#0f1929 !important;border-color:#293950 !important}
        body.dark-ui .full-answer{background:#101b2c !important;border-color:#2b3a52 !important}
        body.dark-ui .full-answer .en-answer,
        body.dark-ui .full-answer .my-answer{background:#0d1826 !important;color:#e8eef9 !important;}
        body.dark-ui .debate-card .question-box{background:#0f1929 !important;border-color:#293950 !important;}
        body.dark-ui .debate-card .question-box .q-text{color:#e8eef9 !important;}
        body.dark-ui .debate-card .question-box .q-text-my{color:#9aa8bd !important;}
        body.dark-ui .step-item .step-content .step-en{color:#e8eef9 !important;}
        body.dark-ui .step-item .step-content .step-my{color:#9aa8bd !important;}
        body.dark-ui .debate-card .topic-en{color:#e8eef9 !important;}
    </style>
</head>
<body>

    <!-- ===== TOP BAR ===== -->
    <header class="top-bar">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Main Dashboard</a>
            <button type="button" class="back-link logout-btn" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
        <h1><i class="fas fa-comments"></i> Debate Practice – MEPT Master Hub</h1>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <span class="stat-item"><i class="fas fa-comments"></i> ခေါင်းစဉ် <strong id="totalCount">0</strong> ခု</span>
            <span class="stat-item"><i class="fas fa-check-circle"></i> အဖြေပါ <strong id="answerCount">0</strong> ခု</span>
            <span class="stat-item"><i class="fas fa-question-circle"></i> Follow-up <strong id="followupCount">0</strong> ခု</span>
        </div>

        <!-- Search -->
        <div class="filter-box">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 ခေါင်းစဉ်ရှာဖွေရန် (ဥပမာ - Safety, Food, English...)">
        </div>

        <!-- Debate List -->
        <div class="debate-list" id="debateList">
            <!-- Dynamically rendered -->
        </div>
    </main>

    <script>
        // ============================================================
        // LOGOUT FUNCTION
        // ============================================================
        function logoutUser() {
            if (confirm('Logout လုပ်ရန် သေချာပါသလား?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('userName');
                sessionStorage.clear();
                window.location.replace('index.html');
            }
        }

        // ============================================================
        // DEBATE DATA (13 topics)
        // ============================================================
        const debateData = [
            // 1
            {
                topicEn: 'Safety Vest and Safety Sign (Agree or Disagree?) How do these protect you from accidents?',
                topicMy: 'ဘေးကင်းရေး အင်္ကျီနှင့် သတိပေး ဆိုင်းဘုတ်များ (သဘောတူ/မတူ) ဒါတွေက မတော်တဆမှုများမှ ဘယ်လိုကာကွယ်ပေးသလဲ?',
                questionEn: 'Do you agree with wearing safety vests and safety signs? How do these protect you from accidents?',
                questionMy: 'ဘေးကင်းရေး အင်္ကျီဝတ်ခြင်းနှင့် သတိပေးဆိုင်းဘုတ်များကို သဘောတူပါသလား? ဒါတွေက မတော်တဆမှုများမှ ဘယ်လိုကာကွယ်ပေးသလဲ?',
                followups: [
                    'Why is it important to wear a safety vest in dark or busy areas?',
                    'What types of safety signs can you see in your workplace or school?',
                    'What could happen if workers ignore safety signs?'
                ],
                steps: [

                steps: [
                    { en: 'State your position: "I believe that higher English proficiency significantly increases job opportunities, but it does not guarantee them on its own."', my: 'သင့်ရပ်တည်ချက်ကို ပြောပါ: "အင်္ဂလိပ်စာ ပိုမိုကျွမ်းကျင်ခြင်းက အလုပ်အကိုင်အခွင့်အလမ်းတွေကို သိသိသာသာ တိုးမြင့်စေတယ်လို့ ကျွန်တော်ယုံကြည်တယ်။ ဒါပေမယ့် တစ်ခုတည်းနဲ့ အာမခံချက်မပေးနိုင်ဘူး။"' },
                    { en: 'Explain the benefits of English: In today\'s globalized world, English is the primary language of business, aviation, and maritime operations. Seafarers with strong English skills can communicate clearly with multinational crews, understand safety instructions, and handle emergencies effectively.', my: 'အင်္ဂလိပ်စာရဲ့ အကျိုးကျေးဇူးတွေ ရှင်းပြပါ: ယနေ့ခေတ် ကမ္ဘာ့ဖလားပြင်ဖြစ်နေတဲ့ ကမ္ဘာမှာ အင်္ဂလိပ်စာဟာ စီးပွားရေး၊ လေကြောင်းနဲ့ ရေကြောင်းလုပ်ငန်းတွေရဲ့ အဓိကဘာသာစကားဖြစ်တယ်။ အင်္ဂလိပ်စာစွမ်းရည်ကောင်းတဲ့ ရေကြောင်းသားတွေဟာ နိုင်ငံပေါင်းစုံက အမှုထမ်းတွေနဲ့ ရှင်းလင်းစွာ ဆက်သွယ်နိုင်တယ်၊ ဘေးကင်းရေး ညွှန်ကြားချက်တွေကို နားလည်နိုင်တယ်၊ အရေးပေါ်အခြေအနေတွေကို ထိရောက်စွာ ကိုင်တွယ်နိုင်တယ်။' },

                ],
                answer: {
                    en: 'I believe that higher English proficiency significantly increases job opportunities, but it does not guarantee them on its own. In today\'s globalized world, English is the primary language of business, aviation, and maritime operations. Seafarers with strong English skills can communicate clearly with multinational crews, understand safety instructions, and handle emergencies effectively. However, employers also look for technical knowledge, experience, soft skills like teamwork and leadership, and a strong work ethic. Therefore, English proficiency is a powerful advantage, but career success depends on a combination of many factors. Continuous learning in all areas is essential.',
                    my: 'အင်္ဂလိပ်စာ ပိုမိုကျွမ်းကျင်ခြင်းက အလုပ်အကိုင်အခွင့်အလမ်းတွေကို သိသိသာသာ တိုးမြင့်စေတယ်လို့ ကျွန်တော်ယုံကြည်တယ်။ ဒါပေမယ့် တစ်ခုတည်းနဲ့ အာမခံချက်မပေးနိုင်ဘူး။ ယနေ့ခေတ် ကမ္ဘာ့ဖလားပြင်ဖြစ်နေတဲ့ ကမ္ဘာမှာ အင်္ဂလိပ်စာဟာ စီးပွားရေး၊ လေကြောင်းနဲ့ ရေကြောင်းလုပ်ငန်းတွေရဲ့ အဓိကဘာသာစကားဖြစ်တယ်။ အင်္ဂလိပ်စာစွမ်းရည်ကောင်းတဲ့ ရေကြောင်းသားတွေဟာ နိုင်ငံပေါင်းစုံက အမှုထမ်းတွေနဲ့ ရှင်းလင်းစွာ ဆက်သွယ်နိုင်တယ်၊ ဘေးကင်းရေး ညွှန်ကြားချက်တွေကို နားလည်နိုင်တယ်၊ အရေးပေါ်အခြေအနေတွေကို ထိရောက်စွာ ကိုင်တွယ်နိုင်တယ်။ ဒါပေမယ့် အလုပ်ရှင်တွေက နည်းပညာဆိုင်ရာ အသိပညာ၊ အတွေ့အကြုံ၊ အသင်းလိုက်လုပ်ဆောင်မှုနဲ့ ခေါင်းဆောင်မှုလိုမျိုး ပျော့ပြောင်းတဲ့စွမ်းရည်တွေနဲ့ ခိုင်မာတဲ့ အလုပ်ကျင့်ဝတ်တွေကိုလည်း ရှာဖွေကြတယ်။ ဒါကြောင့် အင်္ဂလိပ်စာကျွမ်းကျင်မှုက အားသာချက်ကြီးတစ်ခုဖြစ်ပေမယ့် အသက်မွေးဝမ်းကျောင်းအောင်မြင်မှုက အချက်များစွာရဲ့ ပေါင်းစပ်မှုအပေါ် မူတည်ပါတယ်။ နယ်ပယ်အားလုံးမှာ စဉ်ဆက်မပြတ် သင်ယူခြင်းဟာ မရှိမဖြစ်လိုအပ်ပါတယ်။'

        // ============================================================
        // RENDER FUNCTION
        // ============================================================
        function renderDebates(searchTerm) {
            const container = document.getElementById('debateList');
            let filtered = debateData;

            if (searchTerm && searchTerm.trim() !== '') {
                const term = searchTerm.trim().toLowerCase();
                filtered = filtered.filter(d =>
                    d.topicEn.toLowerCase().includes(term) ||
                    d.topicMy.includes(term) ||
                    d.questionEn.toLowerCase().includes(term) ||
                    d.questionMy.includes(term) ||
                    d.followups.some(f => f.toLowerCase().includes(term)) ||
                    d.steps.some(s => s.en.toLowerCase().includes(term) || s.my.includes(term))
                );
            }

            document.getElementById('totalCount').textContent = filtered.length;
            document.getElementById('answerCount').textContent = filtered.length;
            const totalFollowups = filtered.reduce((sum, d) => sum + d.followups.length, 0);
            document.getElementById('followupCount').textContent = totalFollowups;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        ဤရှာဖွေမှုအတွက် ခေါင်းစဉ်မရှိပါ။
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((d, index) => {
                const answerId = `answer_${index}_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
                const globalIndex = debateData.indexOf(d) + 1;

                html += `
                    <div class="debate-card">
                        <span class="topic-number">Topic ${globalIndex}</span>
                        <div class="topic-en">${d.topicEn}</div>
                        <div class="topic-my">${d.topicMy}</div>

                        <div class="question-box">
                            <div class="q-label"><i class="fas fa-question-circle"></i> Debate Question</div>
                            <div class="q-text">${d.questionEn}</div>
                            <div class="q-text-my">${d.questionMy}</div>
                        </div>

                        <div class="followup-box">
                            <div class="f-label"><i class="fas fa-forward"></i> Follow-up Questions</div>
                            <ul>
                                ${d.followups.map(f => `<li>${f}</li>`).join('')}
                            </ul>
                        </div>

                        <div class="steps-section">
                            <div class="steps-title"><i class="fas fa-list-ol"></i> ဖြေပုံဖြေနည်း (Step by Step)</div>
                            ${d.steps.map((s, i) => `
                                <div class="step-item">
                                    <div class="step-num">${i + 1}</div>
                                    <div class="step-content">
                                        <div class="step-en">${s.en}</div>
                                        <div class="step-my">${s.my}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="answer-toggle">
                            <button class="toggle-btn" onclick="toggleAnswer('${answerId}')">
                                <i class="fas fa-eye"></i> အဖြေအပြည့်အစုံကြည့်မည်
                            </button>
                            <div id="${answerId}" class="full-answer">
                                <div class="en-answer">🇬🇧 ${d.answer.en}</div>
                                <div class="my-answer">🇲🇲 ${d.answer.my}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleAnswer(answerId) {
            const answerDiv = document.getElementById(answerId);
            if (answerDiv) {
                answerDiv.classList.toggle('show');
                const btn = answerDiv.parentElement.querySelector('.toggle-btn');
                if (btn) {
                    if (answerDiv.classList.contains('show')) {
                        btn.innerHTML = '<i class="fas fa-eye-slash"></i> အဖြေပိတ်မည်';
                    } else {
                        btn.innerHTML = '<i class="fas fa-eye"></i> အဖြေအပြည့်အစုံကြည့်မည်';
                    }
                }
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderDebates('');

            const searchInput = document.getElementById('searchInput');
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    renderDebates(this.value);
                }, 300);
            });
        });

        // ============================================================
        // COPY PROTECTION (basic)
        // ============================================================
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (['c', 'C', 'a', 'A', 'u', 'U', 's', 'S'].includes(e.key)) e.preventDefault();
            }
            if (e.key === 'F12') e.preventDefault();
        });

        console.log('💬 Debate Practice loaded successfully!');
        console.log('📚 Total topics:', debateData.length);
    </script>

    <script>
        // ============================================================
        // DARK MODE TOGGLE
        // ============================================================
        (function(){
            const btn = document.createElement('button');
            btn.id = 'uiThemeToggle';
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Toggle dark mode');
            btn.innerHTML = '☾';

            const bar = document.querySelector('.top-bar h1') || document.querySelector('.top-bar');
            if (bar) bar.appendChild(btn);

            const saved = localStorage.getItem('mept-ui-theme');
            if (saved === 'dark') {
                document.body.classList.add('dark-ui');
                btn.innerHTML = '☀';
            }

            btn.addEventListener('click', () => {
                document.body.classList.toggle('dark-ui');
                const dark = document.body.classList.contains('dark-ui');
                localStorage.setItem('mept-ui-theme', dark ? 'dark' : 'light');
                btn.innerHTML = dark ? '☀' : '☾';
            });
        })();
    </script>
</body>
</html>
