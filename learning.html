<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MEPT Learning Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ============ BASE & RESET ============ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Myanmar Text', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a1a3a 0%, #0f2f5f 50%, #0a1a3a 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: #1d4ed8;
            top: -180px; left: -150px;
            animation: floatA 18s ease-in-out infinite;
        }
        body::after {
            width: 460px; height: 460px;
            background: #0891b2;
            bottom: -180px; right: -150px;
            animation: floatB 22s ease-in-out infinite;
        }
        @keyframes floatA {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(50px, 40px); }
        }
        @keyframes floatB {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(-40px, -50px); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
            padding: 28px 24px 34px;
            position: relative;
            z-index: 1;
            animation: cardIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h2 {
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }
        .header h2 i { color: #38bdf8; font-size: 22px; }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.15);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .user-badge i { font-size: 8px; color: #22c55e; }

        .home-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #bfdbfe;
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.25s;
        }
        .home-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }
        .home-btn:active { transform: scale(0.95); }

        .welcome { text-align: center; padding: 4px 0 20px; }
        .welcome .icon-big {
            font-size: 42px;
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 20px;
            display: grid; place-items: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 25px -8px rgba(59, 130, 246, 0.8);
        }
        .welcome h1 {
            font-size: 22px;
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.2px;
        }
        .welcome p {
            font-size: 13.5px;
            color: #93b4dd;
            margin-top: 6px;
            line-height: 1.6;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 10px;
        }
        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 18px 10px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .nav-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 15px 30px -12px rgba(59, 130, 246, 0.4);
        }
        .nav-card:active { transform: scale(0.96); }
        .nav-card i {
            font-size: 24px;
            color: #38bdf8;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(56, 189, 248, 0.12);
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }
        .nav-card .label {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .nav-card .badge {
            font-size: 10.5px;
            background: rgba(255, 255, 255, 0.08);
            color: #93b4dd;
            padding: 3px 10px;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stats .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats .stat-item i { color: #38bdf8; font-size: 11px; }

        .footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 11px;
            color: #6b83a8;
            letter-spacing: 0.5px;
        }
        .footer i { color: #38bdf8; margin: 0 4px; }

        @media (max-width: 520px) {
            body { padding: 12px; }
            .container { padding: 20px 16px 26px; border-radius: 20px; }
            .nav-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .nav-card { padding: 14px 8px; }
            .header h2 { font-size: 18px; }
            .welcome h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h2><i class="fas fa-ship"></i> MEPT Hub</h2>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <span class="user-badge" id="userBadge">
                    <i class="fas fa-circle"></i> Loading...
                </span>
                <a href="index.html" class="home-btn">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>

        <div class="welcome">
            <div class="icon-big">📚</div>
            <h1>Learning Hub</h1>
            <p>Maritime English practice — all in one place</p>
        </div>

        <div class="nav-grid">
            <a href="grammar.html" class="nav-card">
                <i class="fas fa-book"></i>
                <span class="label">Grammar</span>
                <span class="badge">50 Qs</span>
            </a>

            <a href="reading.html" class="nav-card">
                <i class="fas fa-book-open"></i>
                <span class="label">Reading</span>
                <span class="badge">7 Passages</span>
            </a>

            <a href="writing.html" class="nav-card">
                <i class="fas fa-pen-fancy"></i>
                <span class="label">Writing</span>
                <span class="badge">15 Topics</span>
            </a>

            <a href="speaking.html" class="nav-card">
                <i class="fas fa-comment"></i>
                <span class="label">Speaking</span>
                <span class="badge">62 Qs</span>
            </a>

            <a href="picturespeaking.html" class="nav-card">
                <i class="fas fa-image"></i>
                <span class="label">Picture</span>
                <span class="badge">12 Topics</span>
            </a>

            <a href="listening.html" class="nav-card">
                <i class="fas fa-headphones"></i>
                <span class="label">Listening</span>
                <span class="badge">34 Qs</span>
            </a>
        </div>

        <div class="stats">
            <span class="stat-item"><i class="fas fa-check-circle"></i> 6 Modules</span>
            <span class="stat-item"><i class="fas fa-tasks"></i> 180+ Exercises</span>
            <span class="stat-item"><i class="fas fa-microphone"></i> Speaking</span>
            <span class="stat-item"><i class="fas fa-headphones"></i> Audio</span>
        </div>

        <div class="footer">
            <i class="fas fa-anchor"></i> MEPT &bull; Maritime English <i class="fas fa-anchor"></i>
        </div>

    </div>

    <!-- ================================================================
         🔐 LOGIN GUARD — DEBUG VERSION
         ================================================================ -->
    <script>
        console.log('=== Learning Hub Guard Started ===');
        console.log('mept_session:', localStorage.getItem('mept_session'));
        console.log('isLoggedIn:', localStorage.getItem('isLoggedIn'));
        console.log('user:', localStorage.getItem('user'));

        (function () {
            const raw = localStorage.getItem('mept_session');

            // ⚠️ ဒီနေရာမှာ debug — ဘာ key ရှိလဲ စစ်ပါ
            console.log('Guard checking mept_session:', raw);

            if (!raw) {
                // session မရှိ → index.html (Login) သို့
                console.warn('❌ mept_session မရှိ → index.html သို့ redirect');
                window.location.replace('index.html');
                return;
            }

            try {
                const session = JSON.parse(raw);
                console.log('Parsed session:', session);

                // username ကို စစ်
                if (!session || !session.username) {
                    console.warn('❌ session.username မရှိ → index.html သို့ redirect');
                    localStorage.removeItem('mept_session');
                    window.location.replace('index.html');
                    return;
                }

                // ✅ Success
                console.log('✅ Session OK. User:', session.username);

                const badge = document.getElementById('userBadge');
                if (badge) {
                    badge.innerHTML = '<i class="fas fa-circle"></i> ' + session.username;
                }
            } catch (e) {
                console.error('❌ Parse error:', e);
                localStorage.removeItem('mept_session');
                window.location.replace('index.html');
            }
        })();
    </script>

</body>
</html>
