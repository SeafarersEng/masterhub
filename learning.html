<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MEPT Learning Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & BASE (mobile-first) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 20, 50, 0.10);
            padding: 20px 18px 30px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .header h2 {
            font-size: 20px;
            color: #0a2a4a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h2 i {
            color: #1a4d8f;
            font-size: 22px;
        }

        .header span {
            font-size: 12px;
            color: #6b7a8f;
            background: #eef2f7;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 600;
        }

        /* ===== WELCOME ===== */
        .welcome {
            text-align: center;
            padding: 8px 0 18px;
        }

        .welcome .icon-big {
            font-size: 44px;
            margin-bottom: 6px;
        }

        .welcome h1 {
            font-size: 22px;
            color: #0a2a4a;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .welcome p {
            font-size: 14px;
            color: #475569;
            margin-top: 4px;
            line-height: 1.5;
        }

        /* ===== GRID NAV (mobile-first cards) ===== */
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .nav-card {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px 8px 14px;
            text-align: center;
            text-decoration: none;
            color: #0a2a4a;
            border: 1px solid #e8edf5;
            transition: 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .nav-card:active {
            transform: scale(0.96);
            background: #eef4ff;
        }

        .nav-card i {
            font-size: 26px;
            color: #1a4d8f;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(26, 77, 143, 0.08);
        }

        .nav-card .label {
            font-size: 13px;
            font-weight: 600;
            color: #0a2a4a;
            line-height: 1.3;
        }

        .nav-card .badge {
            font-size: 10px;
            background: #eef2f7;
            color: #6b7a8f;
            padding: 2px 10px;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ===== STATS BAR (mobile friendly) ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 2px solid #eef2f7;
        }

        .stats .stat-item {
            background: #f8faff;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: #1f3a5f;
            border: 1px solid #e8edf5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats .stat-item i {
            color: #1a4d8f;
            font-size: 12px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 2px solid #eef2f7;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }

        .footer i {
            color: #1a4d8f;
            margin: 0 4px;
        }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 420px) {
            .container {
                padding: 14px 12px 20px;
            }
            .nav-grid {
                gap: 10px;
            }
            .nav-card {
                padding: 12px 4px 10px;
            }
            .nav-card i {
                font-size: 22px;
                width: 38px;
                height: 38px;
            }
            .nav-card .label {
                font-size: 11px;
            }
            .header h2 {
                font-size: 17px;
            }
            .welcome h1 {
                font-size: 19px;
            }
        }

        @media (max-width: 360px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stats .stat-item {
                font-size: 10px;
                padding: 4px 10px;
            }
        }

        /* ===== SCROLLBAR (optional) ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f4f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8c9e0;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h2><i class="fas fa-ship"></i> MEPT Hub</h2>
            <span><i class="fas fa-mobile-alt"></i> Mobile</span>
        </div>

        <!-- ===== WELCOME ===== -->
        <div class="welcome">
            <div class="icon-big">⚓</div>
            <h1>Learning Hub</h1>
            <p>Maritime English practice — all in one place</p>
        </div>

        <!-- ===== 6-ITEM GRID NAV ===== -->
        <div class="nav-grid">

            <!-- Grammar -->
            <a href="grammar.html" class="nav-card">
                <i class="fas fa-book"></i>
                <span class="label">Grammar</span>
                <span class="badge">50 Qs</span>
            </a>

            <!-- Reading -->
            <a href="reading.html" class="nav-card">
                <i class="fas fa-book-open"></i>
                <span class="label">Reading</span>
                <span class="badge">7 Passages</span>
            </a>

            <!-- Writing -->
            <a href="writing.html" class="nav-card">
                <i class="fas fa-pen-fancy"></i>
                <span class="label">Writing</span>
                <span class="badge">15 Topics</span>
            </a>

            <!-- Speaking -->
            <a href="speaking.html" class="nav-card">
                <i class="fas fa-comment"></i>
                <span class="label">Speaking</span>
                <span class="badge">62 Qs</span>
            </a>

            <!-- Picture Speaking -->
            <a href="picturespeaking.html" class="nav-card">
                <i class="fas fa-image"></i>
                <span class="label">Picture</span>
                <span class="badge">12 Topics</span>
            </a>

            <!-- Listening -->
            <a href="listening.html" class="nav-card">
                <i class="fas fa-headphones"></i>
                <span class="label">Listening</span>
                <span class="badge">34 Qs</span>
            </a>

        </div>

        <!-- ===== STATS BAR ===== -->
        <div class="stats">
            <span class="stat-item"><i class="fas fa-check-circle"></i> 6 Modules</span>
            <span class="stat-item"><i class="fas fa-tasks"></i> 180+ Exercises</span>
            <span class="stat-item"><i class="fas fa-microphone"></i> Speaking</span>
            <span class="stat-item"><i class="fas fa-headphones"></i> Audio</span>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <i class="fas fa-anchor"></i> MEPT &bull; Maritime English <i class="fas fa-anchor"></i>
        </div>

    </div>

    <script>
        // Simple active highlight based on current page
        document.addEventListener('DOMContentLoaded', function() {
            const current = window.location.pathname.split('/').pop() || 'index.html';
            const cards = document.querySelectorAll('.nav-card');
            cards.forEach(card => {
                const href = card.getAttribute('href');
                if (href === current) {
                    card.style.background = '#e0ebff';
                    card.style.borderColor = '#1a4d8f';
                    card.style.boxShadow = '0 4px 12px rgba(26,77,143,0.15)';
                }
            });
        });
    </script>

</body>
</html>
