<!-- ================= SCRIPT ================= -->
<script>
  // ================================================================
  // ⚙️ CONFIGURATION — Apps Script URL + Token
  // ================================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwwIIgohqmAtcm6YefKkWrhthy7scTnuorlke0Amt6cUFJ7ltYfpwohicrkl56K7fP/exec";
  const SECRET_TOKEN = "MySecretToken123";

  // ================================================================
  // 🔐 SESSION / TIMING CONFIG
  // ================================================================
  const SESSION_KEY        = 'mept_session';
  const LAST_ACTIVITY_KEY  = 'mept_last_activity';
  const LAST_VERIFY_KEY    = 'mept_last_verify';

  const DEFAULT_EXPIRE_DAYS = 30;
  const EXPIRY_CHECK_MS     = 30 * 1000;              // local expiry check every 30s
  const WARN_BEFORE_MS      = 3 * 24 * 60 * 60 * 1000; // warn 3 days before expiry

  const IDLE_TIMEOUT_MS     = 15 * 60 * 1000;          // 15 minutes idle → logout
  const IDLE_CHECK_MS       = 15 * 1000;               // check every 15s
  const IDLE_WARN_MS        = 60 * 1000;               // warn 1 min before idle logout

  const SERVER_VERIFY_MS    = 5 * 60 * 1000;           // re-verify with server every 5 min

  // ================================================================
  // 🔐 DEVICE ID GENERATOR
  // ================================================================
  function generateDeviceId() {
    const parts = [
      navigator.userAgent || '',
      navigator.language || '',
      navigator.platform || '',
      screen.width + 'x' + screen.height,
      screen.colorDepth || '',
      new Date().getTimezoneOffset(),
      navigator.hardwareConcurrency || '',
      navigator.deviceMemory || '',
      navigator.maxTouchPoints || ''
    ];
    try {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(125, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('MEPT-FP', 2, 15);
      parts.push(canvas.toDataURL());
    } catch (e) {
      parts.push('canvas-err');
    }
    const combined = parts.join('|');
    let hash = 2166136261;
    for (let i = 0; i < combined.length; i++) {
      hash ^= combined.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    hash = hash >>> 0;
    return 'DEV-' + hash.toString(36).toUpperCase().padStart(7, '0');
  }

  const DEVICE_ID = generateDeviceId();

  // ================================================================
  // DOM
  // ================================================================
  const loginOverlay  = document.getElementById('login-overlay');
  const loginForm     = document.getElementById('loginForm');
  const loginError    = document.getElementById('loginError');
  const loginSuccess  = document.getElementById('loginSuccess');
  const loginBtn      = document.getElementById('loginBtn');
  const deviceIdDisp  = document.getElementById('deviceIdDisplay');
  const landingEl     = document.getElementById('landing-container');
  const dashEl        = document.getElementById('dashboard');
  const welcomeUser   = document.getElementById('welcomeUser');
  const logoutBtn     = document.getElementById('logoutBtn');

  if (deviceIdDisp) deviceIdDisp.textContent = DEVICE_ID;

  // ================================================================
  // 💾 SESSION HELPERS
  // ================================================================
  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (e) { return null; }
  }
  function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  function sessionExpired(s) {
    if (!s) return true;
    const t = Date.parse(s.expireAt || '');
    if (isNaN(t)) return false;
    return Date.now() >= t;
  }

  // ================================================================
  // 📅 EXPIRY DATE PARSER
  // ================================================================
  function normalizeExpiry(raw, baseISO) {
    const base = Date.parse(baseISO) || Date.now();
    const fallback = new Date(base + DEFAULT_EXPIRE_DAYS * 86400000).toISOString();

    if (raw === null || raw === undefined || raw === '') return fallback;

    if (typeof raw === 'number' || /^\d{10,13}$/.test(String(raw).trim())) {
      let n = Number(raw);
      if (n < 1e12) n *= 1000;
      const d = new Date(n);
      return isNaN(d) ? fallback : d.toISOString();
    }

    const s = String(raw).trim();

    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999).toISOString();

    m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1], 23, 59, 59, 999).toISOString();

    const t = Date.parse(s);
    return isNaN(t) ? fallback : new Date(t).toISOString();
  }

  function extractExpiry(data, loginAtISO) {
    const src = (data && typeof data.data === 'object' && data.data !== null) ? data.data : (data || {});
    const raw =
      src.expireDate   ?? src.expiryDate ?? src.expiredAt  ?? src.expired_at ??
      src.expire_at    ?? src.expiry     ?? src.exp      ?? src.expireAt   ??
      src.validUntil   ?? src.valid_until ?? src.endDate   ?? null;
    return normalizeExpiry(raw, loginAtISO);
  }

  // ================================================================
  // 🔔 TOAST
  // ================================================================
  function showToast(msg, ms = 6500) {
    let el = document.getElementById('mept-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'mept-toast';
      el.style.cssText =
        'position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);' +
        'background:linear-gradient(135deg,#ef4444,#f59e0b);color:#fff;padding:14px 22px;' +
        'border-radius:14px;font-size:13.5px;font-weight:700;z-index:9999;' +
        'box-shadow:0 18px 40px -14px rgba(0,0,0,.9);max-width:92vw;text-align:center;' +
        'opacity:0;transition:.35s;line-height:1.6;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(-50%) translateY(20px)';
    }, ms);
  }

  // ================================================================
  // 💤 ACTIVITY TRACKING
  // ================================================================
  let lastActivity  = 0;
  let lastSavedAt   = 0;
  let idleWarned    = false;

  // Restore last activity from storage on load
  (function restoreActivity() {
    const v = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY) || '0', 10);
    if (v > 0) lastActivity = v;
  })();

  function touchActivity() {
    lastActivity = Date.now();
    idleWarned = false;
    // Throttle writes — every 20s max
    if (lastActivity - lastSavedAt > 20000) {
      lastSavedAt = lastActivity;
      try { localStorage.setItem(LAST_ACTIVITY_KEY, String(lastActivity)); } catch (e) {}
    }
  }

  // Attach activity listeners (only count when logged in via dashboard visibility)
  ['mousedown', 'keydown', 'touchstart', 'click', 'scroll'].forEach(ev => {
    document.addEventListener(ev, touchActivity, { passive: true });
  });
  let mmTick = 0;
  document.addEventListener('mousemove', () => {
    const now = Date.now();
    if (now - mmTick > 2000) { mmTick = now; touchActivity(); }
  }, { passive: true });

  // Save last activity on pagehide
  window.addEventListener('pagehide', () => {
    if (lastActivity) {
      try { localStorage.setItem(LAST_ACTIVITY_KEY, String(lastActivity)); } catch (e) {}
    }
  });

  // ================================================================
  // 🌐 SERVER VERIFICATION
  // Re-call the login endpoint — if the key is still valid it returns
  // success:true. If it's expired/revoked it returns success:false.
  // ================================================================
  let verifying = false;
  let lastServerVerify = parseInt(localStorage.getItem(LAST_VERIFY_KEY) || '0', 10);

  async function verifyWithServer(session) {
    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: SECRET_TOKEN,
          key: session.key,
          username: session.username,
          deviceId: session.deviceId
        }),
        redirect: 'follow'
      });
      const data = await resp.json();
      lastServerVerify = Date.now();
      try { localStorage.setItem(LAST_VERIFY_KEY, String(lastServerVerify)); } catch (e) {}
      return data;
    } catch (e) {
      console.warn('Server verify failed:', e);
      return null;   // offline / network error
    }
  }

  // ================================================================
  // LOGIN OVERLAY
  // ================================================================
  function openLogin() {
    loginOverlay.classList.add('open');
    loginError.classList.remove('show');
    loginSuccess.classList.remove('show');
    setTimeout(() => document.getElementById('username').focus(), 200);
  }
  function closeLogin() {
    loginOverlay.classList.remove('open');
    loginError.classList.remove('show');
    loginSuccess.classList.remove('show');
  }
  loginOverlay.addEventListener('click', (e) => {
    if (e.target === loginOverlay) closeLogin();
  });

  // ================================================================
  // SHOW / HIDE MESSAGES
  // ================================================================
  function showError(msg) {
    loginSuccess.classList.remove('show');
    loginError.textContent = msg;
    loginError.classList.add('show');
  }
  function showSuccess(msg) {
    loginError.classList.remove('show');
    loginSuccess.textContent = msg;
    loginSuccess.classList.add('show');
  }
  function setLoading(on) {
    if (on) {
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> စစ်ဆေးနေသည်...';
    } else {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login ဝင်မည်';
    }
  }

  // ================================================================
  // LOGIN SUBMIT
  // ================================================================
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('show');
    loginSuccess.classList.remove('show');

    const username = document.getElementById('username').value.trim();
    const key = document.getElementById('password').value.trim();

    if (!username || !key) {
      showError('⚠️ Username နှင့် Key နှစ်ခုလုံး ဖြည့်ပါ။');
      return;
    }

    setLoading(true);

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: SECRET_TOKEN,
          key: key,
          username: username,
          deviceId: DEVICE_ID
        }),
        redirect: 'follow'
      });

      const data = await response.json();
      setLoading(false);

      if (data.success === true) {
        const loginAtISO = new Date().toISOString();
        const session = {
          username: username,
          key: key,
          deviceId: DEVICE_ID,
          loginAt: loginAtISO,
          expireAt: extractExpiry(data, loginAtISO)
        };

        if (sessionExpired(session)) {
          clearSession();
          showError('❌ ဤ Key ၏ သက်တမ်း ကုန်ဆုံးသွားပါပြီ။ Key အသစ် ပြန်ယူပါ။');
          return;
        }

        saveSession(session);

        // Reset activity right after successful login
        touchActivity();
        try { localStorage.setItem(LAST_ACTIVITY_KEY, String(lastActivity)); } catch (e) {}
        lastServerVerify = Date.now();
        try { localStorage.setItem(LAST_VERIFY_KEY, String(lastServerVerify)); } catch (e) {}

        const expStr = new Date(session.expireAt).toLocaleDateString('en-GB',
          { day: '2-digit', month: 'short', year: 'numeric' });
        showSuccess(`✅ ${data.message || 'Login အောင်မြင်ပါသည်။'} (သက်တမ်း: ${expStr} အထိ)`);

        setTimeout(() => {
          showDashboard(session);
          closeLogin();
          loginForm.reset();
        }, 800);

      } else {
        showError('❌ ' + (data.message || 'Login မအောင်မြင်ပါ။'));
      }

    } catch (err) {
      console.error('Login error:', err);
      setLoading(false);
      showError('⚠️ ကွန်ရက် အမှား ဖြစ်ပွားသည်။ Internet စစ်ပြီး ထပ်ကြိုးစားပါ။');
    }
  });

  // ================================================================
  // SHOW DASHBOARD
  // ================================================================
  function showDashboard(session) {
    landingEl.classList.add('hidden');
    dashEl.classList.remove('hidden');
    renderWelcome(session);
    touchActivity();
    startWatchers();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderWelcome(session) {
    if (!welcomeUser || !session) return;
    let txt = `👤 ${session.username} · Welcome!`;
    const t = Date.parse(session.expireAt || '');
    if (!isNaN(t)) {
      const days = Math.ceil((t - Date.now()) / 86400000);
      const dstr = new Date(t).toLocaleDateString('en-GB',
        { day: '2-digit', month: 'short', year: 'numeric' });
      txt += `  ·  သက်တမ်း: ${dstr} အထိ (${days > 0 ? days + ' ရက် ကျန်' : 'ကုန်ဆုံး'})`;
    }
    welcomeUser.textContent = txt;
  }

  // ================================================================
  // ⏰ WATCHERS (expiry + idle + server verify)
  // ================================================================
  let expiryTimer = null;
  let idleTimer   = null;

  function startWatchers() {
    stopWatchers();
    checkExpiryAndVerify();                          // immediate
    checkIdle();                                     // immediate
    expiryTimer = setInterval(checkExpiryAndVerify, EXPIRY_CHECK_MS);
    idleTimer   = setInterval(checkIdle, IDLE_CHECK_MS);
  }
  function stopWatchers() {
    if (expiryTimer) { clearInterval(expiryTimer); expiryTimer = null; }
    if (idleTimer)   { clearInterval(idleTimer);   idleTimer   = null; }
  }

  // --- Expiry + server verify ---
  async function checkExpiryAndVerify() {
    const s = getSession();
    if (!s || !s.username) return;

    // Local expiry (fast)
    if (!s.expireAt) {
      s.expireAt = normalizeExpiry(null, s.loginAt || new Date().toISOString());
      saveSession(s);
    }
    if (sessionExpired(s)) {
      forceLogout('⏰ သင့် Key ၏ သက်တမ်း ကုန်ဆုံးသွားပါပြီ။ ပြန်လည် Login ဝင်ရန် လိုအပ်ပါသည်။');
      return;
    }

    // Warning
    const t = Date.parse(s.expireAt);
    const left = t - Date.now();
    if (left > 0 && left <= WARN_BEFORE_MS && !s.warned) {
      s.warned = true;
      saveSession(s);
      const days = Math.ceil(left / 86400000);
      showToast(`⚠️ သင့် Key သက်တမ်း ${days} ရက် အတွင်း ကုန်ဆုံးတော့မည်။`);
    }

    // Periodic server verify — this is the KEY fix that catches
    // keys that have expired on the server but whose local
    // expireAt still looks valid (e.g. the 30-day fallback).
    if (!verifying && (Date.now() - lastServerVerify >= SERVER_VERIFY_MS)) {
      verifying = true;
      try {
        const data = await verifyWithServer(s);
        if (data && data.success !== true) {
          forceLogout('⏰ သင့် Key ၏ သက်တမ်း ကုန်ဆုံးသွားပါပြီ။ ပြန်လည် Login ဝင်ရန် လိုအပ်ပါသည်။');
          return;
        }
        if (data && data.success === true) {
          // Refresh expireAt from server in case it changed
          const newExp = extractExpiry(data, s.loginAt || new Date().toISOString());
          s.expireAt = newExp;
          saveSession(s);
        }
      } finally {
        verifying = false;
      }
    }

    if (!dashEl.classList.contains('hidden')) renderWelcome(s);
  }

  // --- Idle timeout (15 min) ---
  function checkIdle() {
    const s = getSession();
    if (!s || !s.username) return;

    const idle = Date.now() - lastActivity;

    if (idle >= IDLE_TIMEOUT_MS) {
      forceLogout('💤 ၁၅ မိနစ်ကျော် မသုံးခဲ့သဖြင့် Auto Logout ဖြစ်ပါသည်။ ပြန်လည် Login ဝင်ပါ။');
      return;
    }

    const warnAt = IDLE_TIMEOUT_MS - IDLE_WARN_MS;
    if (!idleWarned && idle >= warnAt) {
      idleWarned = true;
      showToast('⏳ နောက်ထပ် ၁ မိနစ်အတွင်း မသုံးပါက Auto Logout ဖြစ်ပါမည်။', 5500);
    }
  }

  // ================================================================
  // 🚪 FORCE LOGOUT
  // ================================================================
  function forceLogout(message) {
    clearSession();
    stopWatchers();
    try { localStorage.removeItem(LAST_ACTIVITY_KEY); } catch (e) {}
    try { localStorage.removeItem(LAST_VERIFY_KEY);   } catch (e) {}
    lastActivity = 0;
    lastServerVerify = 0;
    idleWarned = false;

    dashEl.classList.add('hidden');
    landingEl.classList.remove('hidden');
    if (welcomeUser) welcomeUser.textContent = '';
    closeLogin();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (message) showToast(message, 8000);
  }

  // ================================================================
  // LOGOUT (manual)
  // ================================================================
  logoutBtn.addEventListener('click', () => {
    if (!confirm('Logout လုပ်ရန် သေချာပါသလား?')) return;
    forceLogout(null);
  });

  // ================================================================
  // AUTO-LOGIN on refresh / page load
  // Show dashboard instantly from local session (if valid locally),
  // then verify with server in the background.
  // ================================================================
  (async function autoLogin() {
    const s = getSession();
    if (!s || !s.username) return;

    if (!s.expireAt) {
      s.expireAt = normalizeExpiry(null, s.loginAt || new Date().toISOString());
      saveSession(s);
    }

    // 1) Local expiry check
    if (sessionExpired(s)) {
      clearSession();
      showToast('⏰ သင့် Key ၏ သက်တမ်း ကုန်ဆုံးသွားပါပြီ။ ပြန်လည် Login ဝင်ပါ။', 8000);
      return;
    }

    // 2) Idle check (e.g. user closed tab 20 min ago and reopened)
    const savedAct = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY) || '0', 10);
    if (savedAct > 0) {
      lastActivity = savedAct;
      if (Date.now() - savedAct >= IDLE_TIMEOUT_MS) {
        clearSession();
        showToast('💤 ၁၅ မိနစ်ကျော် မသုံးခဲ့သဖြင့် Auto Logout ဖြစ်ပါသည်။ ပြန်လည် Login ဝင်ပါ။', 8000);
        return;
      }
    } else {
      // No stored activity — start fresh
      touchActivity();
    }

    // 3) Show dashboard immediately (fast perceived load)
    showDashboard(s);

    // 4) Verify with server in background
    const data = await verifyWithServer(s);
    if (data && data.success !== true) {
      forceLogout('⏰ သင့် Key ၏ သက်တမ်း ကုန်ဆုံးသွားပါပြီ။ ပြန်လည် Login ဝင်ရန် လိုအပ်ပါသည်။');
      return;
    }
    if (data && data.success === true) {
      const newExp = extractExpiry(data, s.loginAt || new Date().toISOString());
      s.expireAt = newExp;
      saveSession(s);
      renderWelcome(s);
    }
  })();

  // ================================================================
  // 🔄 Tab visibility / focus → re-check + re-verify
  // ================================================================
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const s = getSession();
    if (!s) return;
    checkIdle();
    checkExpiryAndVerify();
  });
  window.addEventListener('focus', () => {
    const s = getSession();
    if (!s) return;
    checkIdle();
    checkExpiryAndVerify();
  });

  // ================================================================
  // SMOOTH SCROLL
  // ================================================================
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', (e) => {
      const target = document.querySelector(a.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
</script>
