<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mock Test 102 – MEPT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Myanmar Text', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f4f9;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 16px 14px 24px;
            box-shadow: 0 8px 30px rgba(0, 20, 50, 0.08);
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .top-bar h2 {
            font-size: 18px;
            color: #0a2a4a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar h2 i { color: #1a4d8f; }

        .btn-back {
            background: #eef2f7;
            border: none;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 13px;
            color: #1f3a5f;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-back:active { transform: scale(0.95); background: #dce3ed; }

        .timer-bar {
            background: #f8fafc;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            color: #0a2a4a;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #e2e8f0;
        }
        .timer-bar i { color: #1a4d8f; }

        /* ===== SECTION ===== */
        .section {
            background: #f8faff;
            border-radius: 16px;
            padding: 14px 12px;
            margin-bottom: 16px;
            border-left: 5px solid #1a4d8f;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #0a2a4a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: #1a4d8f; width: 22px; text-align: center; }

        .question {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .question:last-child { border-bottom: none; margin-bottom: 0; }

        .q-text {
            font-size: 14px;
            font-weight: 600;
            color: #0a2a4a;
            margin-bottom: 5px;
        }
        .q-text .q-label { font-weight: 400; color: #64748b; font-size: 13px; }

        .options {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-left: 4px;
        }
        .options label {
            font-size: 14px;
            color: #1f3a5f;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            cursor: pointer;
            touch-action: manipulation;
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a4d8f;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ===== READING ===== */
        .passage {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            line-height: 1.8;
            color: #1f3a5f;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }
        .passage strong { color: #0a2a4a; }

        /* ===== LISTENING ===== */
        .listening-script {
            background: #fef9e7;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #fdebd0;
            font-size: 14px;
            line-height: 1.8;
            color: #5b3e00;
            margin-bottom: 10px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .listening-script i { color: #d4891e; }

        .audio-container {
            background: #f1f5f9;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .audio-container audio {
            flex: 1;
            min-width: 180px;
            height: 40px;
            width: 100%;
        }
        .play-status {
            font-weight: 600;
            font-size: 14px;
            color: #1a4d8f;
            background: #fff;
            padding: 4px 16px;
            border-radius: 50px;
            border: 1px solid #d1d9e6;
            white-space: nowrap;
        }
        .play-status.limited {
            color: #dc2626;
            background: #fee2e2;
            border-color: #dc2626;
        }

        /* ===== SPEAKING ===== */
        .speaking-card {
            border: 2px solid #f0b429;
            background: #fefcf5;
            border-radius: 16px;
            padding: 14px;
            margin-top: 6px;
        }
        .speaking-card .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .speaking-card .timer-display {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f4c75;
        }
        .speak-btn {
            background: #0f4c75;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .speak-btn:active { transform: scale(0.95); }
        .speak-btn.playing { background: #e53e3e; }
        .speak-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .speaking-prompt-box {
            background: #f1f5f9;
            padding: 12px 14px;
            border-radius: 10px;
            margin: 12px 0;
            border-left: 4px solid #f0b429;
            transition: all 0.3s ease;
        }
        .speaking-prompt-box strong {
            color: #0a2a4a;
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .speaking-prompt-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #1f3a5f;
        }

        .speaking-card textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d1d9e6;
            font-family: inherit;
            font-size: 14px;
            background: #fafcff;
            min-height: 80px;
            resize: vertical;
        }

        /* ===== WRITING ===== */
        .writing-option {
            background: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .writing-option h5 { color: #0a2a4a; font-size: 14px; margin-bottom: 3px; }
        .writing-option p { font-size: 13px; color: #475569; margin-bottom: 6px; }
        .writing-option textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d1d9e6;
            font-family: inherit;
            font-size: 13px;
            background: #fafcff;
            min-height: 60px;
            resize: vertical;
        }

        /* ===== BUTTONS ===== */
        .btn-submit {
            background: #1a4d8f;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin: 8px 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .btn-submit:active { transform: scale(0.97); background: #0f3a6b; }

        .btn-reset {
            background: #eef2f7;
            color: #1f3a5f;
            border: none;
            padding: 10px 0;
            width: 100%;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin: 4px 0;
            touch-action: manipulation;
        }
        .btn-reset:active { transform: scale(0.97); background: #dce3ed; }

        /* ===== RESULTS ===== */
        #resultsContainer {
            display: none;
            animation: fadeIn 0.4s ease;
            margin-top: 16px;
        }
        #resultsContainer.show { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section {
            background: #f8faff;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-left: 5px solid #1a4d8f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .result-section .label { font-weight: 600; font-size: 14px; color: #0a2a4a; }
        .result-section .grade {
            font-weight: 800;
            font-size: 18px;
            padding: 2px 14px;
            border-radius: 50px;
        }
        .grade-a { background: #dcfce7; color: #166534; }
        .grade-b { background: #fef9e7; color: #92400e; }
        .grade-c { background: #fee2e2; color: #991b1b; }

        .overall-result {
            background: #1a4d8f;
            color: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            margin-top: 10px;
        }
        .overall-result.fail { background: #991b1b; }
        .overall-result .sub { font-weight: 400; font-size: 13px; opacity: 0.9; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container { padding: 12px 10px 16px; }
            .top-bar h2 { font-size: 16px; }
            .section { padding: 12px 10px; }
            .section-title { font-size: 15px; }
            .q-text { font-size: 13px; }
            .options label { font-size: 13px; }
            .passage { font-size: 13px; padding: 8px 10px; }
            .listening-script { font-size: 13px; padding: 10px 12px; }
            .speaking-prompt-box p { font-size: 14px; }
            .speaking-card textarea { font-size: 13px; }
            .writing-option textarea { font-size: 13px; }
            .btn-submit { font-size: 15px; padding: 12px 0; }
            .audio-container audio { min-width: 120px; }
        }

        @media (max-width: 380px) {
            .result-section { flex-direction: column; align-items: flex-start; gap: 4px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .timer-bar { justify-content: center; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f0f4f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b8c9e0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">

        <!-- TOP BAR -->
        <div class="top-bar">
            <h2><i class="fas fa-vial"></i> Mock Test 102</h2>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <span class="timer-bar" id="timerDisplay"><i class="fas fa-clock"></i> 120:00</span>
                <a href="mocktest.html" class="btn-back"><i class="fas fa-arrow-left"></i> Hub</a>
            </div>
        </div>

        <!-- EXAM FORM -->
        <form id="testForm" onsubmit="return false;">

            <!-- ===== GRAMMAR (40) ===== -->
            <div class="section">
                <div class="section-title"><i class="fas fa-book"></i> Grammar (40 Qs)</div>
                <div id="grammarQuestions"></div>
            </div>

            <!-- ===== READING (20) ===== -->
            <div class="section">
                <div class="section-title"><i class="fas fa-book-open"></i> Reading (20 Qs)</div>
                <div id="readingQuestions"></div>
            </div>

            <!-- ===== LISTENING (20) ===== -->
            <div class="section">
                <div class="section-title"><i class="fas fa-headphones"></i> Listening (20 Qs)</div>
                <div id="listeningQuestions"></div>
            </div>

            <!-- ===== WRITING ===== -->
            <div class="section">
                <div class="section-title"><i class="fas fa-pen-fancy"></i> Writing</div>
                <div id="writingQuestions"></div>
            </div>

            <!-- ===== SPEAKING ===== -->
            <div class="section">
                <div class="section-title"><i class="fas fa-comment"></i> Speaking (7 Qs)</div>
                <div id="speakingQuestions"></div>
            </div>

            <!-- BUTTONS -->
            <button type="button" class="btn-submit" id="submitBtn"><i class="fas fa-check-circle"></i> Submit & Grade</button>
            <button type="button" class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> Reset All</button>
        </form>

        <!-- ===== RESULTS ===== -->
        <div id="resultsContainer">
            <div id="resultsContent"></div>
            <button type="button" class="btn-reset" onclick="window.location.reload();"><i class="fas fa-redo"></i> Try Again</button>
        </div>

    </div>

    <script>
        // ================================================================
        // 0. LISTENING TRACKER (2 plays limit)
        // ================================================================
        let listeningPlayCount = 0;
        const MAX_LISTENING_PLAYS = 2;

        // ================================================================
        // 1. GRAMMAR DATA (40 NEW questions)
        // ================================================================
        const GRAMMAR_DATA = [
            { q: "The ship ________ in Singapore next Monday.", opts: ["a) arrive", "b) arrives", "c) arriving"], ans: "b" },
            { q: "They ________ the cargo when the storm started.", opts: ["a) loading", "b) were loading", "c) load"], ans: "b" },
            { q: "All lifejackets ________ checked before departure.", opts: ["a) must be", "b) must", "c) must have"], ans: "a" },
            { q: "The captain ________ the crew about the weather now.", opts: ["a) informs", "b) is informing", "c) informed"], ans: "b" },
            { q: "If the fog clears, we ________ the port.", opts: ["a) will enter", "b) enter", "c) would enter"], ans: "a" },
            { q: "The bosun told me ________ the ropes immediately.", opts: ["a) to secure", "b) secure", "c) securing"], ans: "a" },
            { q: "The pilot ________ the ship safely through the channel yesterday.", opts: ["a) guides", "b) guided", "c) guiding"], ans: "b" },
            { q: "The crew ________ enough food for the long voyage.", opts: ["a) have", "b) has", "c) having"], ans: "a" },
            { q: "The engine room ________ very hot all day.", opts: ["a) is", "b) are", "c) was"], ans: "c" },
            { q: "The officer ________ the radar every 15 minutes.", opts: ["a) checks", "b) check", "c) checking"], ans: "a" },
            { q: "You ________ wear your lifejacket on deck.", opts: ["a) should", "b) shouldn't", "c) might"], ans: "a" },
            { q: "The lifeboat ________ launched by the crew.", opts: ["a) is", "b) was", "c) were"], ans: "b" },
            { q: "The deck ________ by the crew right now.", opts: ["a) is being cleaned", "b) cleans", "c) cleaning"], ans: "a" },
            { q: "The vessel ________ the port yet.", opts: ["a) hasn't left", "b) haven't left", "c) didn't leave"], ans: "a" },
            { q: "The meeting is scheduled ________ 10 a.m.", opts: ["a) at", "b) on", "c) in"], ans: "a" },
            { q: "The crew worked ________ to finish the job.", opts: ["a) hard", "b) hardly", "c) hardness"], ans: "a" },
            { q: "There are ________ containers on the deck.", opts: ["a) many", "b) much", "c) a lot"], ans: "a" },
            { q: "The engineers ________ repaired the generator.", opts: ["a) have", "b) has", "c) having"], ans: "a" },
            { q: "Remember ________ the fire alarm before leaving.", opts: ["a) to test", "b) test", "c) testing"], ans: "a" },
            { q: "The crew ________ finished the safety drill.", opts: ["a) have", "b) has", "c) haven't"], ans: "a" },
            { q: "The third officer ________ the watch every midnight.", opts: ["a) takes", "b) take", "c) taking"], ans: "a" },
            { q: "All equipment ________ ready for the voyage.", opts: ["a) were", "b) was", "c) is"], ans: "b" },
            { q: "The ship will dock ________ the port tomorrow.", opts: ["a) at", "b) in", "c) on"], ans: "a" },
            { q: "The bosun ________ the deck crew every morning.", opts: ["a) inspects", "b) inspect", "c) inspecting"], ans: "a" },
            { q: "You ________ use your phone in the engine room.", opts: ["a) should not", "b) shouldn't", "c) might"], ans: "a" },
            { q: "The captain ________ to the port authorities now.", opts: ["a) talks", "b) is talking", "c) talk"], ans: "b" },
            { q: "The cargo ________ in the containers.", opts: ["a) is stored", "b) stores", "c) storing"], ans: "a" },
            { q: "The fire drill ________ once a month.", opts: ["a) conducts", "b) is conducted", "c) conducting"], ans: "b" },
            { q: "I ________ to work on a cruise ship.", opts: ["a) want", "b) wants", "c) wanting"], ans: "a" },
            { q: "The lifeboat ________ capacity for 50 people.", opts: ["a) has", "b) have", "c) having"], ans: "a" },
            { q: "The chief officer ________ the schedule next week.", opts: ["a) reviews", "b) will review", "c) reviewing"], ans: "b" },
            { q: "The mooring lines ________ by the bosun.", opts: ["a) checks", "b) are checked", "c) checking"], ans: "b" },
            { q: "The vessel ________ at dawn.", opts: ["a) departs", "b) depart", "c) departing"], ans: "a" },
            { q: "The officers ________ the navigation plan carefully.", opts: ["a) study", "b) studies", "c) studying"], ans: "a" },
            { q: "All safety equipment ________ tested regularly.", opts: ["a) are", "b) is", "c) being"], ans: "b" },
            { q: "The pump ________ down for repairs.", opts: ["a) is shut", "b) shuts", "c) shutting"], ans: "a" },
            { q: "The crew ________ drills to stay prepared.", opts: ["a) conducts", "b) conduct", "c) conducting"], ans: "b" },
            { q: "The voyage ________ about two weeks.", opts: ["a) lasts", "b) last", "c) lasting"], ans: "a" },
            { q: "The second officer ________ the logbook now.", opts: ["a) reads", "b) is reading", "c) read"], ans: "b" },
            { q: "The cargo ________ to be loaded tomorrow.", opts: ["a) is scheduled", "b) schedules", "c) scheduling"], ans: "a" }
        ];

        // ================================================================
        // 2. READING DATA (4 NEW passages)
        // ================================================================
        const READING_DATA = [{
            title: "Weather at Sea",
            text: "Weather plays a crucial role in maritime navigation. Storms, fog, and high waves can make voyages dangerous. Seafarers rely on weather forecasts from shore stations and satellite imagery to plan safe routes. The captain and officers monitor barometric pressure and wind speed constantly. If a storm is approaching, the crew will secure all loose equipment, reduce speed, and change course if necessary. Understanding weather patterns is essential for the safety of the ship and crew.",
            questions: [
                { q: "Weather is not important for maritime navigation.", ans: "F" },
                { q: "Seafarers use weather forecasts to plan routes.", ans: "T" },
                { q: "The captain monitors wind speed and pressure.", ans: "T" },
                { q: "Crew members ignore approaching storms.", ans: "F" },
                { q: "Understanding weather is essential for safety.", ans: "T" }
            ]
        }, {
            title: "The Role of a Chief Engineer",
            text: "The Chief Engineer is the head of the engine department. He is responsible for the operation and maintenance of all machinery on the ship, including the main engine, generators, and pumps. He ensures that the engine room runs safely and efficiently. The Chief Engineer supervises the engineering officers and ratings. He also monitors fuel consumption and maintains logs of all repairs. A good Chief Engineer is knowledgeable, decisive, and calm under pressure.",
            questions: [
                { q: "The Chief Engineer supervises the engine department.", ans: "T" },
                { q: "The Chief Engineer does not monitor fuel consumption.", ans: "F" },
                { q: "The Chief Engineer works only in the deck department.", ans: "F" },
                { q: "A good Chief Engineer stays calm under pressure.", ans: "T" },
                { q: "The Chief Engineer maintains repair logs.", ans: "T" }
            ]
        }, {
            title: "Navigational Aids",
            text: "Navigational aids are devices that help ships find their way safely. The Global Positioning System (GPS) provides accurate location data. Radar helps detect other vessels, land, and obstacles in poor visibility. Electronic Chart Display and Information Systems (ECDIS) show digital maps and routes. Traditional methods like compasses and paper charts are still used as backups. All these tools work together to ensure the ship navigates safely from port to port.",
            questions: [
                { q: "GPS provides accurate location data.", ans: "T" },
                { q: "Radar is used only during daylight.", ans: "F" },
                { q: "ECDIS shows digital maps and routes.", ans: "T" },
                { q: "Compasses are no longer used on ships.", ans: "F" },
                { q: "Navigational aids help ships travel safely.", ans: "T" }
            ]
        }, {
            title: "Lifeboat Maintenance",
            text: "Lifeboats are critical for survival in emergencies. They must be maintained and inspected regularly. The crew tests the engine, checks the fuel level, and ensures the lifeboat is in good condition. Safety equipment inside the lifeboat, such as food, water, flares, and first aid kits, must also be checked. Regular lifeboat drills are held so that everyone knows how to board and launch the lifeboat quickly. Proper maintenance saves lives.",
            questions: [
                { q: "Lifeboats do not need regular maintenance.", ans: "F" },
                { q: "The engine and fuel must be checked.", ans: "T" },
                { q: "Lifeboats contain first aid kits.", ans: "T" },
                { q: "Drills are not required for lifeboats.", ans: "F" },
                { q: "Proper maintenance is essential for safety.", ans: "T" }
            ]
        }];

        // ================================================================
        // 3. LISTENING DATA (20 questions based on Party Invitation)
        // ================================================================
        const LISTENING_SCRIPT = `Automated message: You have two new messages. Message number one, received today at 3.45 p.m.

        Hi, it's me. How's it going? I guess you're at work and you don't have your phone on, right? First of all, thank you, THANK YOU for the birthday card and message. I received it this morning. That's so nice of you. I'm organising a little party for my birthday. It's nothing very big – only a few of my best and closest friends. That means you too! We're going to have it at my cousin's house. She lives in the countryside in a nice big house with a swimming pool. I'd love to see you there. It's going to be this Friday. I'll send you the instructions on how to get there later, OK? 

        Anyway, have fun at work. Don't work too hard, OK? Talk soon.

        Automated message: You have two new messages. Message number two, received today at 5.15 p.m.

        Aw, you're still not answering your phone! OK, here are the instructions to get to my cousin's house for the party. Are you going to take your car? If you take the car, drive straight on Forest Road until you get to the motorway. Drive past Brownsville and take exit 13A. That's 13A. You drive down the road there and turn left. It's the first big house on the right. OK? If you're taking a bus, you can get the number 80 to Brownsville. Call me when you get there and somebody can pick you up in a car. I can't wait. This is going to be so great!`;

        const LISTENING_DATA = [
            { q: "What time was the first message received?", opts: ["A. 3:15 p.m.", "B. 3:45 p.m.", "C. 5:15 p.m."], ans: "B" },

//  PLAY LISTENING SCRIPT (AI Voice with 2-play limit)
// ================================================================
function playListeningScript() {
    const btn = document.getElementById('listeningPlayBtn');
    const status = document.getElementById('listeningStatus');
    if (!btn || !status) return;

    // If currently speaking, stop it
    if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        btn.innerHTML = `<i class="fas fa-volume-up"></i> 🔈 Play Script (${listeningPlayCount}/${MAX_LISTENING_PLAYS})`;
        btn.classList.remove('playing');
        return;
    }

    // Check play limit
    if (listeningPlayCount >= MAX_LISTENING_PLAYS) {
        alert(`⚠️ ဤအသံဖိုင် (Audio) ကို ${MAX_LISTENING_PLAYS} ကြိမ်သာ ဖွင့်နိုင်ပါသည်။`);
        return;
    }

    // Increment count
    listeningPlayCount++;
    btn.innerHTML = `<i class="fas fa-stop"></i> ⏹️ Playing... (${listeningPlayCount}/${MAX_LISTENING_PLAYS})`;
    btn.classList.add('playing');

    // Update status badge
    status.textContent = `▶️ ${listeningPlayCount} / ${MAX_LISTENING_PLAYS}`;
    if (listeningPlayCount >= MAX_LISTENING_PLAYS) {
        status.classList.add('limited');
        status.style.color = '#dc2626';
        status.style.background = '#fee2e2';
        status.style.borderColor = '#dc2626';
    } else {
        status.classList.remove('limited');
        status.style.color = '#1a4d8f';
        status.style.background = '#fff';
        status.style.borderColor = '#d1d9e6';
    }

    // Prepare the text to speak (clean up whitespace)
    const text = LISTENING_SCRIPT.replace(/\s+/g, ' ').trim();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.pitch = 1;
    utterance.volume = 1;

    // Try to use a good voice (Google or Samantha for iOS)
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha'))) || 
                     voices.find(v => v.lang.startsWith('en')) || null;
    if (preferred) utterance.voice = preferred;

    // When speech ends
    utterance.onend = function() {
        btn.innerHTML = `<i class="fas fa-volume-up"></i> 🔈 Play Script (${listeningPlayCount}/${MAX_LISTENING_PLAYS})`;
        btn.classList.remove('playing');
        if (listeningPlayCount >= MAX_LISTENING_PLAYS) {
            btn.disabled = true;
            btn.style.opacity = '0.6';
            btn.style.cursor = 'not-allowed';
            btn.style.transform = 'none !important';
        }
    };

    utterance.onerror = function(event) {
        if (event.error !== 'canceled') {
            btn.innerHTML = `<i class="fas fa-volume-up"></i> 🔈 Play Script (${listeningPlayCount}/${MAX_LISTENING_PLAYS})`;
            btn.classList.remove('playing');
            alert('AI Voice ဖွင့်ရာတွင် အမှားရှိသည်။');
        }
    };

    window.speechSynthesis.speak(utterance);
}

            const gAnswers = GRAMMAR_DATA.map(q => q.ans);
            gAnswers.forEach((ans, i) => {
                const sel = document.querySelector(`input[name="gq${i}"]:checked`);
                if (sel && sel.value === ans) gScore++;
            });
            total += gScore; max += 40;

            // ---- Reading (20 x 1.5 = 30) ----
            let rScore = 0;
            const rAnswers = READING_DATA.flatMap(p => p.questions.map(q => q.ans));
            rAnswers.forEach((ans, idx) => {
                const sel = document.querySelector(`input[name="rq${idx}"]:checked`);
                if (sel && sel.value === ans) rScore += 1.5;
            });
            total += rScore; max += 30;

            // ---- Listening (20 x 1.25 = 25) ----
            let lScore = 0;
            const lAnswers = LISTENING_DATA.map(q => q.ans);
            lAnswers.forEach((ans, i) => {
                const sel = document.querySelector(`input[name="lq${i}"]:checked`);
                if (sel && sel.value === ans) lScore += 1.25;
            });
            total += lScore; max += 25;

            // ---- Writing (Part1:10, Part2:15) ----
            let wScore = 0;
            let p1Text = '';
            WRITING_PART1.forEach(w => {
                const text = document.getElementById(`w1${w.id}`)?.value || '';
                if (text.length > p1Text.length) p1Text = text;
            });
            const wc1 = p1Text.split(/\s+/).filter(w => w.length > 0).length;
            wScore += Math.min(10, Math.floor(wc1 / 3));
            if (wc1 >= 20) wScore = 10;

            let p2Text = '';
            WRITING_PART2.forEach(w => {
                const text = document.getElementById(`w2${w.id}`)?.value || '';
                if (text.length > p2Text.length) p2Text = text;
            });
            const wc2 = p2Text.split(/\s+/).filter(w => w.length > 0).length;
            wScore += Math.min(15, Math.floor(wc2 / 5));
            if (wc2 >= 60) wScore = 15;
            total += wScore; max += 25;

            // ---- Speaking (scale to 15) ----
            let rawSpeaking = 0, rawMax = 0;
            SPEAKING_DATA.forEach((_, i) => {
                const text = speakingAnswers[i] || document.getElementById(`sp_${i}`)?.value || '';
                const wc = text.split(/\s+/).filter(w => w.length > 0).length;
                rawSpeaking += Math.min(1, Math.floor(wc / 3));
                rawMax += 1;
            });
            let sScore = rawMax > 0 ? Math.round((rawSpeaking / rawMax) * 15) : 0;
            total += sScore; max += 15;

            const pct = Math.round((total / max) * 100);
            const lGrade = getGrade(Math.round((lScore / 25) * 100));
            const sGrade = getGrade(Math.round((sScore / 15) * 100));
            const finalPass = !(lGrade.grade === 'C' || sGrade.grade === 'C');

            let html = `<div style="font-size:17px; font-weight:700; margin-bottom:12px; color:#0a2a4a;"><i class="fas fa-chart-pie"></i> Test Results</div>`;

            const sections = [
                { label: 'Grammar', score: gScore, max: 40 },
                { label: 'Reading', score: rScore, max: 30 },
                { label: 'Listening', score: lScore, max: 25 },
                { label: 'Writing', score: wScore, max: 25 },
                { label: 'Speaking', score: sScore, max: 15 }
            ];

            sections.forEach(sec => {
                const p = Math.round((sec.score / sec.max) * 100);
                const g = getGrade(p);
                html += `
                    <div class="result-section">
                        <span class="label">${sec.label}</span>
                        <span class="grade ${g.class}">${g.grade} (${sec.score}/${sec.max})</span>
                    </div>
                `;
            });

            html += `
                <div class="overall-result ${finalPass ? '' : 'fail'}">
                    <div>Overall: ${finalPass ? 'PASS' : 'FAIL'}</div>
                    <div class="sub">${finalPass ? 'All sections passed' : 'Fail: Listening or Speaking grade is C'}</div>
                    <div style="font-size:14px; font-weight:400; margin-top:4px;">Score: ${total}/${max} (${pct}%)</div>
                </div>
            `;

            document.getElementById('resultsContent').innerHTML = html;
            document.getElementById('resultsContainer').classList.add('show');
            document.getElementById('testForm').style.display = 'none';
        }

        // ================================================================
        // 11. RESET
        // ================================================================
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (timerInterval) clearInterval(timerInterval);
            if (speakingTimer) clearInterval(speakingTimer);
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            document.getElementById('testForm').reset();
            document.getElementById('resultsContainer').classList.remove('show');
            document.getElementById('testForm').style.display = 'block';
            timeLeft = 120 * 60;
            startTimer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            speakingAnswers = new Array(SPEAKING_DATA.length).fill('');
            currentSpeakingIndex = 0;
            renderSpeaking();
            renderListening();
        });

        // ================================================================
        // 12. INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderGrammar();
            renderReading();
            renderListening();
            renderWriting();
            renderSpeaking();
            startTimer();

            if (window.speechSynthesis) {
                setTimeout(() => { window.speechSynthesis.getVoices(); }, 100);
            }

            document.getElementById('submitBtn').addEventListener('click', submitExam);
        });

        console.log('✅ Mock Test 102 loaded - All questions are NEW and different from Test 101');
        console.log('🎵 Listening: invitation_to_a_party.mp3 (2 plays max)');
    </script>

</body>
