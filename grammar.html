<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Grammar – MEPT Master Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ============ BASE ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Myanmar Text', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a1a3a 0%, #0f2f5f 50%, #0a1a3a 100%);
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
      color: #eef2ff;
      line-height: 1.7;
    }

    /* animated orbs */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 520px; height: 520px;
      background: #1d4ed8;
      top: -180px; left: -160px;
      animation: floatA 18s ease-in-out infinite;
    }
    body::after {
      width: 480px; height: 480px;
      background: #0891b2;
      bottom: -200px; right: -160px;
      animation: floatB 22s ease-in-out infinite;
    }
    @keyframes floatA {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(60px, 50px); }
    }
    @keyframes floatB {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(-50px, -60px); }
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease;
      padding-bottom: 30px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ STICKY HEADER ============ */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 26, 58, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 10px 30px -12px rgba(0,0,0,0.6);
    }
    .top-bar h2 {
      font-size: 17px;
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-bar h2 i { color: #38bdf8; }

    .btn-back {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 7px 16px;
      border-radius: 100px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }
    .btn-back:active { transform: scale(0.96); }

    /* ============ SCORE BAR ============ */
    .score-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .score-item i {
      font-size: 16px;
      margin-bottom: 2px;
    }
    .score-item .score-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8fa6c4;
    }
    .score-item .score-val {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .score-item.correct i { color: #22c55e; }
    .score-item.correct .score-val { color: #86efac; }
    .score-item.wrong i { color: #ef4444; }
    .score-item.wrong .score-val { color: #fca5a5; }
    .score-item.done i { color: #38bdf8; }
    .score-item.done .score-val { color: #7dd3fc; }

    /* ============ SECTION DIVIDER ============ */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 16px;
      padding: 12px 18px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(59, 130, 246, 0.12));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 22px -12px rgba(56, 189, 248, 0.6);
      position: relative;
      overflow: hidden;
    }
    .section-divider::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #38bdf8, #06b6d4);
    }
    .section-divider i {
      color: #38bdf8;
      font-size: 15px;
      width: 24px;
      text-align: center;
    }
    .section-divider .sec-count {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 800;
      color: #bfdbfe;
      letter-spacing: 0.5px;
    }

    /* ============ CARD ============ */
    .qa-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .qa-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #3b82f6, #06b6d4);
      opacity: 0.7;
      transition: 0.3s;
    }
    .qa-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 16px 36px -20px rgba(56, 189, 248, 0.55);
    }
    .qa-card.answered {
      background: rgba(255, 255, 255, 0.07);
    }

    /* ============ QUESTION ============ */
    .question-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      line-height: 1.75;
      margin-bottom: 14px;
      padding-left: 6px;
    }
    .question-text u {
      text-decoration: underline;
      text-decoration-color: #fbbf24;
      text-decoration-thickness: 2.5px;
      text-underline-offset: 3px;
      color: #fde68a;
      font-weight: 700;
    }

    /* ============ OPTIONS ============ */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: #d4def0;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }
    .option-item:not(:disabled):hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.4);
      color: #fff;
      transform: translateX(4px);
    }
    .option-item:not(:disabled):active {
      transform: scale(0.98) translateX(2px);
    }
    .option-item:disabled {
      cursor: default;
      opacity: 1;
    }
    .option-item.correct {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.6);
      color: #86efac;
      font-weight: 700;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }
    .option-item.wrong {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
      font-weight: 700;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }
    .option-item .opt-icon {
      font-size: 15px;
      flex-shrink: 0;
    }
    .option-item.correct .opt-icon { color: #22c55e; }
    .option-item.wrong .opt-icon { color: #ef4444; }

    /* ============ FEEDBACK ============ */
    .feedback {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 11px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      animation: slideDown 0.3s ease;
    }
    .feedback.show { display: flex; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .feedback.ok {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }
    .feedback.no {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    /* ============ REVEAL BUTTON ============ */
    .reveal-trigger-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      color: #7dd3fc;
      cursor: pointer;
      transition: 0.25s;
      width: 100%;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .reveal-trigger-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
      color: #fff;
    }
    .reveal-trigger-btn:active { transform: scale(0.97); }

    /* ============ EXPLANATION BOX ============ */
    .explanation-box {
      display: none;
      margin-top: 14px;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 14px;
      padding: 16px 16px 12px;
      flex-direction: column;
      gap: 4px;
      animation: slideDown 0.35s ease;
    }
    .explanation-box.show { display: flex; }

    .exp-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .exp-row:last-child { border-bottom: none; }

    .exp-label {
      font-size: 10.5px;
      font-weight: 800;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .correct-ans-highlight {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 6px 14px;
      border-radius: 100px;
      color: #86efac;
      font-weight: 700;
      font-size: 13.5px;
    }

    .exp-row .text-content {
      font-size: 13.5px;
      line-height: 1.75;
      color: #d4def0;
    }

    /* ============ FOOTER ============ */
    .footer {
      margin-top: 30px;
      padding: 22px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 12px;
      color: #8fa6c4;
      letter-spacing: 0.5px;
    }
    .footer i { color: #38bdf8; margin: 0 4px; }
    .footer b { color: #7dd3fc; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { max-width: 100%; }
      .top-bar { padding: 12px 14px; border-radius: 16px; }
      .top-bar h2 { font-size: 15px; }
      .btn-back { padding: 6px 14px; font-size: 11.5px; }
      .score-bar { padding: 12px 12px; gap: 8px; }
      .score-item .score-val { font-size: 17px; }
      .score-item .score-label { font-size: 9.5px; }
      .qa-card { padding: 16px 14px; border-radius: 16px; }
      .question-text { font-size: 13.5px; }
      .option-item { font-size: 13px; padding: 11px 14px; }
      .section-divider { font-size: 12.5px; padding: 10px 14px; }
    }

    @media (max-width: 380px) {
      .score-bar { grid-template-columns: 1fr 1fr; }
      .score-item.done { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ===== STICKY HEADER ===== -->
    <div class="top-bar">
      <h2><i class="fas fa-book"></i> Grammar 100 Qs</h2>
      <a href="learning.html" class="btn-back">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <!-- ===== SCORE BAR ===== -->
    <div class="score-bar">
      <div class="score-item correct">
        <i class="fas fa-check-circle"></i>
        <span class="score-label">Correct</span>
        <span class="score-val" id="scoreCorrect">0</span>
      </div>
      <div class="score-item wrong">
        <i class="fas fa-times-circle"></i>
        <span class="score-label">Wrong</span>
        <span class="score-val" id="scoreWrong">0</span>
      </div>
      <div class="score-item done">
        <i class="fas fa-list-ol"></i>
        <span class="score-label">Done</span>
        <span class="score-val"><span id="scoreDone">0</span>/100</span>
      </div>
    </div>

    <!-- ===== QUESTIONS ===== -->
    <div id="grammarList"></div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
      <i class="fas fa-anchor"></i> MEPT <b>Grammar</b> · 8 Parts of Speech + 12 Tenses <i class="fas fa-anchor"></i>
      <br>
      <span style="font-size: 11px;">Copyright &copy; 2026 TTNY Team. All rights reserved.</span>
    </div>

  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
    // ============================================================
    // GRAMMAR QUESTIONS — 8 Parts of Speech (40) + 12 Tenses (60)
    // ============================================================
    const GRAMMAR_QUESTIONS = [

      // ══════════════════════════════════════════════════════
      // PART 1: 8 PARTS OF SPEECH (Q1 – Q40)
      // ══════════════════════════════════════════════════════

      // ---------- NOUN (5) ----------
      { id: 1, section: "Parts of Speech: NOUN",
        question: "1. The <u>captain</u> gave the order to the crew. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Noun", "b) Verb", "c) Adjective"],
        correct: "a) Noun",
        why: "'captain' သည် လူပုဂ္ဂိုလ်တစ်ဦးကို ခေါ်ဆိုသော နာမ် (Noun) ဖြစ်ပါသည်။",
        strategy: "လူ၊ နေရာ၊ အရာ၊ အကြောင်းအရာကို ခေါ်သော စကားလုံးသည် Noun ဖြစ်သည်။" },
      { id: 2, section: "Parts of Speech: NOUN",
        question: "2. The ship arrived at the <u>port</u> yesterday. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Adverb", "b) Noun", "c) Conjunction"],
        correct: "b) Noun",
        why: "'port' သည် နေရာတစ်ခုကို ခေါ်သော နာမ် (Noun) ဖြစ်ပါသည်။",
        strategy: "Preposition (at, in, on) နောက်မှာ လာတဲ့ စကားလုံးဟာ Noun ဖြစ်တတ်သည်။" },
      { id: 3, section: "Parts of Speech: NOUN",
        question: "3. Safety is our top <u>priority</u> on board. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Noun", "b) Pronoun", "c) Preposition"],
        correct: "a) Noun",
        why: "'priority' သည် ဦးစားပေးမှုကို ပြသော နာမ် (Noun) ဖြစ်ပါသည်။",
        strategy: "Adjective (top) နောက်မှာ လာတဲ့ စကားလုံးဟာ Noun ဖြစ်တတ်သည်။" },
      { id: 4, section: "Parts of Speech: NOUN",
        question: "4. The <u>engineer</u> repaired the main engine. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Verb", "b) Adjective", "c) Noun"],
        correct: "c) Noun",
        why: "'engineer' သည် လူပုဂ္ဂိုလ်တစ်ဦးကို ခေါ်သော နာမ် (Noun) ဖြစ်ပါသည်။",
        strategy: "The + လူခေါ်စကားလုံး ဆိုတဲ့အခါ Noun ဖြစ်တတ်သည်။" },
      { id: 5, section: "Parts of Speech: NOUN",
        question: "5. My <u>hometown</u> is Yangon. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Noun", "b) Adverb", "c) Interjection"],
        correct: "a) Noun",
        why: "'hometown' သည် နေရာတစ်ခုကို ခေါ်သော နာမ် (Noun) ဖြစ်ပါသည်။",
        strategy: "My/Your/His + စကားလုံး ဆိုတဲ့အခါ Noun ဖြစ်တတ်သည်။" },

      // ---------- PRONOUN (5) ----------
      { id: 6, section: "Parts of Speech: PRONOUN",
        question: "6. <u>He</u> is the chief officer on this ship. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Noun", "b) Pronoun", "c) Verb"],
        correct: "b) Pronoun",
        why: "'He' သည် လူပုဂ္ဂိုလ်တစ်ဦးကို အစားထိုးသုံးသော နာမ်စား (Pronoun) ဖြစ်ပါသည်။",
        strategy: "I, we, you, he, she, it, they, me, us, him, her, them — Pronoun များဖြစ်သည်။" },
      { id: 7, section: "Parts of Speech: PRONOUN",
        question: "7. The bosun asked <u>us</u> to clean the deck. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Pronoun", "b) Preposition", "c) Adverb"],
        correct: "a) Pronoun",
        why: "'us' သည် လူအုပ်စုကို အစားထိုးသုံးသော နာမ်စား (Pronoun) ဖြစ်ပါသည်။",
        strategy: "Object Pronoun (me, us, you, him, her, it, them) များလည်း Pronoun ဖြစ်သည်။" },
      { id: 8, section: "Parts of Speech: PRONOUN",
        question: "8. <u>They</u> are working in the engine room. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Adjective", "b) Noun", "c) Pronoun"],
        correct: "c) Pronoun",
        why: "'They' သည် လူအုပ်စုကို အစားထိုးသုံးသော နာမ်စား (Pronoun) ဖြစ်ပါသည်။",
        strategy: "Subject Pronoun (I, you, he, she, it, we, they) များလည်း Pronoun ဖြစ်သည်။" },
      { id: 9, section: "Parts of Speech: PRONOUN",
        question: "9. This life jacket is <u>mine</u>. — အောက်ခံစကားလုံးသည် ဘယ် Part of Speech လဲ?",
        options: ["a) Pronoun", "b) Verb", "c) Conjunction"],
        correct: "a) Pronoun",
        why: "'mine' သည် ပိုင်ဆိုင်မှုကို ပြသော Possessive Pronoun ဖြစ်ပါသည်။",

    // ============================================================
    // STATE
    // ============================================================
    let correctCount = 0;
    let wrongCount = 0;

    // ============================================================
    // RENDER
    // ============================================================
    function renderGrammar() {
      const container = document.getElementById('grammarList');
      if (!container) return;

      let html = "";
      let lastSec = "";

      GRAMMAR_QUESTIONS.forEach((q, qi) => {
        if (q.section && q.section !== lastSec) {
          lastSec = q.section;
          const count = GRAMMAR_QUESTIONS.filter(x => x.section === q.section).length;
          html += `
            <div class="section-divider">
              <i class="fas fa-bookmark"></i>
              <span>${q.section}</span>
              <span class="sec-count">${count} Qs</span>
            </div>
          `;
        }

        html += `
          <div class="qa-card" data-qi="${qi}">
            <div class="question-text">${q.question}</div>
            <div class="options-stack">
              ${q.options.map((opt, oi) =>
                `<button type="button" class="option-item"
                         onclick="selectOption(this, ${qi}, ${oi})">${opt}</button>`
              ).join('')}
            </div>
            <div class="feedback"></div>
            <button type="button" class="reveal-trigger-btn" onclick="toggleExplanation(this)">
              <i class="fas fa-search"></i> Show Analysis
            </button>
            <div class="explanation-box">
              <div class="exp-row">
                <span class="exp-label"><i class="fas fa-check-circle"></i> Correct Answer</span>
                <span class="correct-ans-highlight">
                  <i class="fas fa-check-circle"></i> ${q.correct}
                </span>
              </div>
              <div class="exp-row">
                <span class="exp-label"><i class="fas fa-info-circle"></i> Explanation</span>
                <div class="text-content">${q.why}</div>
              </div>
              <div class="exp-row">
                <span class="exp-label"><i class="fas fa-lightbulb"></i> Strategy</span>
                <div class="text-content">${q.strategy}</div>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ============================================================
    // SELECT OPTION
    // ============================================================
    function selectOption(btn, qi, oi) {
      const card = btn.closest('.qa-card');
      if (!card || card.classList.contains('answered')) return;
      card.classList.add('answered');

      const q = GRAMMAR_QUESTIONS[qi];
      const correctIndex = q.options.indexOf(q.correct);
      const isCorrect = (oi === correctIndex);

      const optionBtns = card.querySelectorAll('.option-item');
      optionBtns.forEach((b, i) => {
        b.disabled = true;
        if (i === correctIndex) {
          b.classList.add('correct');
          b.innerHTML = `<span>${q.options[i]}</span><i class="fas fa-check-circle opt-icon"></i>`;
        } else if (i === oi) {
          b.classList.add('wrong');
          b.innerHTML = `<span>${q.options[i]}</span><i class="fas fa-times-circle opt-icon"></i>`;
        }
      });

      const fb = card.querySelector('.feedback');
      fb.classList.add('show', isCorrect ? 'ok' : 'no');
      fb.innerHTML = isCorrect
        ? `<i class="fas fa-check-circle"></i> မှန်ပါတယ်! Correct answer.`
        : `<i class="fas fa-times-circle"></i> မှားပါတယ်။ အဖြေမှန်ကို အစိမ်းရောင်နဲ့ ပြထားပါတယ်။`;

      if (isCorrect) correctCount++; else wrongCount++;
      updateScore();

      const expBox = card.querySelector('.explanation-box');
      const rBtn = card.querySelector('.reveal-trigger-btn');
      document.querySelectorAll('.explanation-box.show').forEach(b => b.classList.remove('show'));
      document.querySelectorAll('.reveal-trigger-btn').forEach(b => {
        b.innerHTML = '<i class="fas fa-search"></i> Show Analysis';
      });
      expBox.classList.add('show');
      rBtn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Analysis';
    }

    // ============================================================
    // SCORE
    // ============================================================
    function updateScore() {
      document.getElementById('scoreCorrect').textContent = correctCount;
      document.getElementById('scoreWrong').textContent = wrongCount;
      document.getElementById('scoreDone').textContent = correctCount + wrongCount;
    }

    // ============================================================
    // TOGGLE EXPLANATION
    // ============================================================
    function toggleExplanation(btn) {
      const box = btn.nextElementSibling;
      if (!box || !box.classList.contains('explanation-box')) return;
      const isShowing = box.classList.contains('show');

      document.querySelectorAll('.explanation-box.show').forEach(b => b.classList.remove('show'));
      document.querySelectorAll('.reveal-trigger-btn').forEach(b => {
        b.innerHTML = '<i class="fas fa-search"></i> Show Analysis';
      });

      if (!isShowing) {
        box.classList.add('show');
        btn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Analysis';
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', renderGrammar);
  </script>
